<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="steps" data-width="1920" data-height="1080">
    <!-- Counter: the digit rolls 1 -> 2 -> 3 inside a clay disc. -->
    <div id="pas-counter" class="ph-counter">
      <div id="pas-disc" class="ph-disc" data-layout-allow-overflow>
        <div id="pas-digits" class="ph-digits"><span>1</span><span>2</span><span>3</span></div>
      </div>
      <span id="pas-of" class="ph-of">/ 3</span>
    </div>

    <!-- One text block per step, each in its own window. -->
    <div id="pas-t1" class="ph-step clip" data-start="0" data-duration="4.7" data-track-index="1">
      <h2 id="pas-t1-title" class="ph-step-title">Protéger</h2>
      <p id="pas-t1-sub" class="ph-step-sub">Sécurisez la zone pour éviter un <b>sur-accident</b>.</p>
    </div>
    <div id="pas-t2" class="ph-step clip" data-start="4.7" data-duration="4.7" data-track-index="1">
      <h2 id="pas-t2-title" class="ph-step-title">Alerter</h2>
      <p id="pas-t2-sub" class="ph-step-sub">Prévenez les secours sans attendre.</p>
    </div>
    <div id="pas-t3" class="ph-step clip" data-start="9.4" data-duration="5.6" data-track-index="1">
      <h2 id="pas-t3-title" class="ph-step-title">Secourir</h2>
      <p id="pas-t3-sub" class="ph-step-sub">Intervenez selon <b>votre formation</b>.</p>
    </div>

    <div class="ph-progress">
      <div class="ph-seg"><i id="pas-p1"></i></div>
      <div class="ph-seg"><i id="pas-p2"></i></div>
      <div class="ph-seg"><i id="pas-p3"></i></div>
    </div>

    <div class="ph-stage" data-layout-allow-overflow>
      <svg viewBox="0 0 780 860">
        <defs>
          <radialGradient id="pas-cw" cx="36%" cy="22%" r="85%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.55" stop-color="#f5f7fb" />
            <stop offset="1" stop-color="#d3dbe9" />
          </radialGradient>
          <linearGradient id="pas-base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fdfeff" />
            <stop offset="1" stop-color="#d9e0ec" />
          </linearGradient>
          <radialGradient id="pas-verm" cx="34%" cy="26%" r="85%">
            <stop offset="0" stop-color="#ff8576" />
            <stop offset="0.5" stop-color="#e34234" />
            <stop offset="1" stop-color="#a92c22" />
          </radialGradient>
          <radialGradient id="pas-night" cx="32%" cy="22%" r="90%">
            <stop offset="0" stop-color="#34466f" />
            <stop offset="0.55" stop-color="#16244a" />
            <stop offset="1" stop-color="#0b1633" />
          </radialGradient>
          <radialGradient id="pas-white" cx="34%" cy="24%" r="90%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.6" stop-color="#f3f6fb" />
            <stop offset="1" stop-color="#d5ddea" />
          </radialGradient>
          <filter id="pas-soft" x="-40%" y="-40%" width="180%" height="200%">
            <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#0b1633" flood-opacity="0.16" />
          </filter>
          <filter id="pas-blur" x="-50%" y="-200%" width="200%" height="500%">
            <feGaussianBlur stdDeviation="14" />
          </filter>
        </defs>

        <!-- The cloud plinth every object stands on. -->
        <g id="pas-plinth" filter="url(#pas-soft)">
          <circle cx="170" cy="700" r="95" fill="url(#pas-cw)" />
          <circle cx="340" cy="660" r="130" fill="url(#pas-cw)" />
          <circle cx="530" cy="680" r="115" fill="url(#pas-cw)" />
          <circle cx="660" cy="720" r="80" fill="url(#pas-cw)" />
          <rect x="70" y="700" width="660" height="120" rx="60" fill="url(#pas-base)" />
        </g>

        <!-- Step 1: warning triangle and the protected zone around it. -->
        <g id="pas-v1">
          <ellipse id="pas-ring" cx="390" cy="752" rx="290" ry="46" fill="none" stroke="#e34234" stroke-width="9"
            stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" opacity="0.9" />
          <ellipse cx="390" cy="748" rx="170" ry="16" fill="#0b1633" opacity="0.18" filter="url(#pas-blur)" />
          <g id="pas-tri">
            <path d="M390 340 L575 680 L205 680 Z" fill="url(#pas-verm)" stroke="url(#pas-verm)" stroke-width="56"
              stroke-linejoin="round" filter="url(#pas-soft)" />
            <rect x="372" y="430" width="36" height="150" rx="18" fill="#ffffff" />
            <circle cx="390" cy="632" r="22" fill="#ffffff" />
            <path d="M330 420 Q360 370 380 360" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.35" />
          </g>
        </g>

        <!-- Step 2: a phone showing the emergency numbers. -->
        <g id="pas-v2">
          <ellipse cx="390" cy="748" rx="150" ry="16" fill="#0b1633" opacity="0.2" filter="url(#pas-blur)" />
          <g id="pas-phone">
            <rect x="245" y="150" width="290" height="590" rx="54" fill="url(#pas-night)" filter="url(#pas-soft)" />
            <rect x="262" y="167" width="256" height="556" rx="40" fill="#f8fafd" />
            <rect x="350" y="184" width="80" height="14" rx="7" fill="#0b1633" opacity="0.85" />
            <g id="pas-n1">
              <text x="290" y="290" font-family="Geist" font-size="76" font-weight="660" letter-spacing="-2" fill="#e34234">15</text>
              <text x="292" y="332" class="ph-label">SAMU</text>
            </g>
            <line x1="290" y1="364" x2="490" y2="364" stroke="#dce3f0" stroke-width="3" />
            <g id="pas-n2">
              <text x="290" y="450" font-family="Geist" font-size="76" font-weight="660" letter-spacing="-2" fill="#e34234">18</text>
              <text x="292" y="492" class="ph-label">Pompiers</text>
            </g>
            <line x1="290" y1="524" x2="490" y2="524" stroke="#dce3f0" stroke-width="3" />
            <g id="pas-n3">
              <text x="290" y="610" font-family="Geist" font-size="76" font-weight="660" letter-spacing="-2" fill="#e34234">112</text>
              <text x="292" y="652" class="ph-label">Urgences</text>
            </g>
          </g>
          <g fill="none" stroke="#e34234" stroke-width="10" stroke-linecap="round">
            <path id="pas-w1" d="M580 230 A40 40 0 0 1 580 300" />
            <path id="pas-w2" d="M612 200 A80 80 0 0 1 612 330" />
            <path id="pas-w3" d="M644 170 A120 120 0 0 1 644 360" />
          </g>
        </g>

        <!-- Step 3: first-aid kit and a heartbeat. -->
        <g id="pas-v3">
          <path id="pas-pulse" d="M90 300 H290 L320 240 L360 380 L400 190 L440 330 L465 300 H690" fill="none" stroke="#e34234"
            stroke-width="10" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" />
          <ellipse cx="390" cy="748" rx="200" ry="18" fill="#0b1633" opacity="0.2" filter="url(#pas-blur)" />
          <g id="pas-kit">
            <path d="M320 480 V445 Q320 415 350 415 H430 Q460 415 460 445 V480" fill="none" stroke="#0b1633" stroke-width="26" stroke-linecap="round" />
            <rect x="200" y="470" width="380" height="275" rx="50" fill="url(#pas-white)" filter="url(#pas-soft)" />
            <rect x="362" y="532" width="56" height="150" rx="16" fill="url(#pas-verm)" />
            <rect x="315" y="579" width="150" height="56" rx="16" fill="url(#pas-verm)" />
          </g>
        </g>
      </svg>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const S = [0, 4.7, 9.4]; // step starts (scene time), mirrored in each text block's data-start
    const L = 4.7;

    // ---- Shared step system (identical in every Phaness video) ----
    function stepText(t, title, sub, last) {
      tl.fromTo(title, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, t + 0.15);
      tl.fromTo(sub, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, t + 0.32);
      if (!last) tl.to([title, sub], { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in", stagger: 0.04 }, t + L - 0.32);
    }
    function stepCounter(t, i, seg) {
      if (i > 0) tl.to("#pas-digits", { y: -128 * i, duration: 0.55, ease: "expo.inOut" }, t - 0.05);
      tl.fromTo(seg, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, t + 0.1);
    }
    tl.fromTo("#pas-disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.75)" }, 0.05);
    tl.fromTo("#pas-of", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 0.2);
    tl.fromTo("#pas-plinth", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "elastic.out(1, 0.85)" }, 0);
    gsap.set(["#pas-p1", "#pas-p2", "#pas-p3"], { scaleX: 0 });
    gsap.set(["#pas-v2", "#pas-v3"], { opacity: 0 });

    ["#pas-p1", "#pas-p2", "#pas-p3"].forEach((seg, i) => stepCounter(S[i], i, seg));
    stepText(S[0], "#pas-t1-title", "#pas-t1-sub", false);
    stepText(S[1], "#pas-t2-title", "#pas-t2-sub", false);
    stepText(S[2], "#pas-t3-title", "#pas-t3-sub", true);

    // ---- Step 1: the triangle drops onto the cloud, the zone is drawn around it ----
    tl.fromTo("#pas-tri", { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: "elastic.out(1, 0.7)" }, S[0] + 0.25);
    tl.fromTo("#pas-ring", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, S[0] + 0.9);
    tl.to("#pas-v1", { opacity: 0, y: 60, duration: 0.3, ease: "power3.in" }, S[1] - 0.45);

    // ---- Step 2: the phone rises, the three numbers light up one by one ----
    tl.fromTo("#pas-v2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, S[1] - 0.15);
    tl.fromTo("#pas-phone", { y: 260, scale: 0.9, transformOrigin: "50% 100%" }, { y: 0, scale: 1, duration: 1.0, ease: "elastic.out(1, 0.8)" }, S[1] - 0.15);
    ["#pas-n1", "#pas-n2", "#pas-n3"].forEach((n, i) => {
      tl.fromTo(n, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, S[1] + 0.7 + i * 0.45);
    });
    // The phone rings: the waves sweep outward twice.
    ["#pas-w1", "#pas-w2", "#pas-w3"].forEach((w, i) => {
      const t = S[1] + 2.4 + i * 0.1;
      tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
      tl.to(w, { opacity: 0, duration: 0.25, ease: "power1.in" }, t + 0.3);
      tl.to(w, { opacity: 1, duration: 0.12, ease: "none" }, t + 0.6);
      tl.to(w, { opacity: 0, duration: 0.25, ease: "power1.in" }, t + 0.9);
    });
    tl.to("#pas-v2", { opacity: 0, y: 60, duration: 0.3, ease: "power3.in" }, S[2] - 0.45);

    // ---- Step 3: the kit lands, the heartbeat is drawn across ----
    tl.fromTo("#pas-v3", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, S[2] - 0.15);
    tl.fromTo("#pas-kit", { y: -380 }, { y: 0, duration: 1.0, ease: "elastic.out(1, 0.7)" }, S[2] - 0.1);
    tl.fromTo("#pas-pulse", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, S[2] + 0.8);

    window.__timelines["steps"] = tl;
  </script>
</template>
