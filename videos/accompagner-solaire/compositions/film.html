      const p = (r) => `${(300 + r * Math.sin(a)).toFixed(1)} ${(390 - r * Math.cos(a)).toFixed(1)}`;

      ticks.appendChild(l);

      ["L", [[6, 9], [17, 22]]], ["M", [[6, 9], [17, 22]]], ["M", [[6, 9], [12, 22]]], ["J", [[6, 9], [17, 22]]],
      ["V", [[6, 9], [17, 23]]], ["S", [[7, 23]]], ["D", [[7, 23]]],

    grid.style.cssText = "left:0;top:0;width:840px;height:700px";

        const k = document.createElement("div");
        k.className = "blk";
        k.dataset.row = r;
        k.style.cssText = `left:${a * H_PX}px;width:${(b - a) * H_PX}px`;
        tr.appendChild(k);
      });
      grid.appendChild(tr);
    });
