<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(160deg, #F7FAFF 0%, #E6E6F8 52%, #D0CDF1 100%); }
    #s4-svg, #s4-ov { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .s4-card { position: absolute; background: #00043E; color: #F7FAFF; padding: 12px 20px 14px; }
    .s4-card .hf-cap { position: static; font-size: 26px; }
  </style>
  <div id="root" data-composition-id="s4" data-width="1920" data-height="1080" data-duration="6.8" data-layout-allow-overflow data-layout-allow-overlap>
    <svg id="s4-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <svg id="s4-ov" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <h1 class="hf-t hf-h1" id="s4-h1" style="left: 440px; top: 186px; color: #00043E"><span class="ln"><span>Collé directement</span></span><span class="ln"><span>sur la membrane d’étanchéité</span></span></h1>
    <p class="hf-t hf-sub" id="s4-sub" style="left: 440px; top: 372px; color: #00043E"><span class="ln"><span>Sans percement, sans lestage</span></span></p>
    <div class="s4-card" id="s4-k1" style="left: 1030px; top: 236px"><p class="hf-t hf-cap" style="position: static; white-space: nowrap">Certifié IEC 61215 · 61730 · 61701</p></div>
    <div class="s4-card" id="s4-k2" style="left: 1030px; top: 316px"><p class="hf-t hf-cap" style="position: static; white-space: nowrap">Avis techniques bâtiment</p></div>
    <div class="s4-card" id="s4-k3" style="left: 1030px; top: 396px"><p class="hf-t hf-cap" style="position: static; white-space: nowrap">Solution assurable</p></div>
    <div class="s4-card" id="s4-k4" style="left: 800px; top: 922px"><p class="hf-t hf-cap" style="position: static; white-space: nowrap; font-size: 24px">Résiste à la grêle et à des vents de plus de 270 km/h</p></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const O = 14.6, A = (t) => t - O;
      const k = 4.6, h = 36;
      const I = new Iso(k, 990, 600 + h * k - 500 * k);
      const CEN = Park.CEN, x0 = CEN.x, y0 = CEN.y, W = CEN.w, D = CEN.d, f = HF.f;
      const svg = document.getElementById("s4-svg");
      const P = (x, y, z) => I.p(x, y, z === undefined ? h : z);
      const cellOf = (c, r) => CEN.cells.find((q) => q[2] === c && q[3] === r);
      const C0 = { s: 1, x: 288, y: -28 };

      // ---- panels: thin rigid boxes, deep-blue cells under thin glass ----
      let cl = "";
      for (let i = 1; i < 10; i++) cl += `M${i * 2.4} 0V10`;
      for (let j = 1; j < 4; j++) cl += `M0 ${j * 2.5}H24`;
      const panelSvg = (id, cx, cy) => {
        const o = I.p(cx, cy, h + 0.3);
        return `<g id="${id}">${I.box(cx, cy, h, 24, 10, 0.3, { top: "#0B2F94", l: "#C9D6F7", r: "#A2B4E4" })}<g transform="${I.top(h + 0.3)}"><g transform="translate(${cx} ${cy})"><rect width="24" height="10" fill="#0B2F94"/><path d="${cl}" stroke="#5D86DD" stroke-opacity=".55" stroke-width=".8" fill="none" vector-effect="non-scaling-stroke"/><rect x=".3" y=".3" width="23.4" height="9.4" fill="none" stroke="#9FB6EE" stroke-opacity=".7" stroke-width="1" vector-effect="non-scaling-stroke"/></g></g></g>`;
      };

      let s = `<defs>
        <pattern id="s4-rib" patternUnits="userSpaceOnUse" width="5" height="400"><rect width="0.9" height="400" fill="rgba(0,4,62,.16)"/></pattern>
        <linearGradient id="s4-fade" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="4"><stop offset="0" stop-color="#E2E7F7"/><stop offset=".55" stop-color="#E2E7F7"/><stop offset="1" stop-color="#E2E7F7" stop-opacity="0"/></linearGradient>
        <linearGradient id="s4-fadeR" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="4"><stop offset="0" stop-color="#A7B2D8"/><stop offset=".55" stop-color="#A7B2D8"/><stop offset="1" stop-color="#A7B2D8" stop-opacity="0"/></linearGradient>`;
      for (let r = 0; r < 12; r++) {
        const row = CEN.cells.filter((q) => q[3] === r && !(r === 11 && q[2] < 3));
        if (!row.length) continue;
        const mn = Math.min(...row.map((q) => q[0]));
        s += `<clipPath id="s4-rc${r}"><rect id="s4-rr${r}" x="${mn}" y="${y0 + 10 + r * 10 - 1}" width="0" height="12"/></clipPath>`;
      }
      s += `</defs><g id="s4-cam"><g id="s4-body">`;
      // walls under the roof package
      s += `<g id="s4-walls"><g transform="${I.faceY(y0 + D, 0)}"><rect x="${x0}" y="0" width="${W}" height="${h}" fill="url(#s4-fade)"/><rect x="${x0}" y="0" width="${W}" height="${h}" fill="url(#s4-rib)"/></g>
        <g transform="${I.faceX(x0 + W, 0)}"><rect x="${y0}" y="0" width="${D}" height="${h}" fill="url(#s4-fadeR)"/><rect x="${y0}" y="0" width="${D}" height="${h}" fill="url(#s4-rib)"/></g></g>`;
      // the cut: roof package layers on both visible faces
      const xf = [0, 1, 2, 3, 4, 5, 6].map((i) => x0 + 2 + i * 38);
      const strips = (u0, len, face, beams) => {
        let t = `<g transform="${face}"><rect x="${u0}" y="23" width="${len}" height="13" fill="#1E2878"/>`;
        t += `<rect x="${u0}" y="35.1" width="${len}" height=".9" fill="#FFFFFF"/><rect x="${u0}" y="31.2" width="${len}" height="3.9" fill="#DAD8EE"/><rect x="${u0}" y="30" width="${len}" height="1.2" fill="#9BA5CC"/>`;
        t += `<path d="${Array.from({ length: Math.floor(len / 3) }, (_, i) => `M${u0 + 1.5 + i * 3} 30v1.2`).join("")}" stroke="#00043E" stroke-opacity=".35" stroke-width=".6" vector-effect="non-scaling-stroke"/>`;
        t += `<rect x="${u0}" y="27" width="${len}" height="3" fill="#B3BCDE"/>`;
        t += beams.map((b) => `<rect x="${b}" y="23" width="3" height="4" fill="#9AA3C4"/>`).join("");
        return t + `</g>`;
      };
      s += `<g id="s4-strips">${strips(x0, W, I.faceY(y0 + D, 0), xf)}${strips(y0, D, I.faceX(x0 + W, 0), [])}</g>`;
      // roof: membrane with its rolls, far parapets, adhesive strips under the first panel
      s += `<g id="s4-roof" transform="${I.top(h)}"><rect x="${x0}" y="${y0}" width="${W}" height="${D}" fill="#F0F3FF"/><path d="${Array.from({ length: 13 }, (_, j) => `M${x0} ${y0 + 10 + j * 10}h${W}`).join("")}" stroke="#B9C0E6" stroke-width="1" fill="none" vector-effect="non-scaling-stroke"/></g>`;
      const par = { top: "#FFFFFF", l: "#D9DEF3", r: "#B5BCE0" };
      s += I.box(x0, y0, h, W, 3, 2.5, par) + I.box(x0, y0, h, 3, D, 2.5, par);
      const c0 = cellOf(0, 11), c1 = cellOf(1, 11), c2 = cellOf(2, 11);
      s += `<g id="s4-adh" transform="${I.top(h)}" opacity="0">${[c0, c1, c2].map((c) => `<path d="M${c[0] + 4} ${c[1] + 1}v8M${c[0] + 12} ${c[1] + 1}v8M${c[0] + 20} ${c[1] + 1}v8" stroke="#07BDF0" stroke-opacity=".55" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`).join("")}</g>`;
      // cascade rows
      for (let r = 11; r >= 0; r--) {
        const row = CEN.cells.filter((q) => q[3] === r && !(r === 11 && q[2] < 3));
        if (!row.length) continue;
        s += `<g id="s4-row${r}" transform="${I.top(h + 0.3)}" opacity="0"><g clip-path="url(#s4-rc${r})"><path d="${Park.cellPath(row, 0.3)}" fill="#0B2F94" stroke="#5D86DD" stroke-opacity=".55" stroke-width=".4"/></g></g>`;
      }
      // placed by hand
      s += panelSvg("s4-p1", c0[0], c0[1]) + panelSvg("s4-p2", c1[0], c1[1]) + panelSvg("s4-p3", c2[0], c2[1]);
      // rooftop volumes, after the panels
      CEN.ex.forEach((e) => { s += I.box(e[0], e[1], h, e[2], e[3], e[4], { top: "#FFFFFF", l: "#CFD6EE", r: "#9EAAD3" }); });
      s += I.box(x0, y0 + D - 3, h, W, 3, 2.5, par).replace("<g ", `<g id="s4-parN" `) + I.box(x0 + W - 3, y0, h, 3, D, 2.5, par).replace("<g ", `<g id="s4-parE" `);
      s += `<g id="s4-filet" fill="none" stroke="#07BDF0" stroke-width="3.5" stroke-linecap="round" opacity="0"><path id="s4-fil1" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M${P(c0[0], c0[1] + 10).join(" ")}L${P(c0[0] + 24, c0[1] + 10).join(" ")}"/></g>`;
      s += `</g>`;
      // two installers: stylised, no face. feet at (0,0).
      const fig = (id) => `<g id="${id}" opacity="0"><g id="${id}-in">
        <rect x="-9" y="-40" width="7.5" height="40" rx="2" fill="#1B2370"/><rect x="1.5" y="-40" width="7.5" height="40" rx="2" fill="#1B2370"/>
        <rect x="-12" y="-78" width="24" height="42" rx="5" fill="#00043E"/><rect x="-12" y="-62" width="24" height="4" fill="#07BDF0"/>
        <path d="M-12 -72L-24 -56M12 -72L24 -56" stroke="#00043E" stroke-width="7" stroke-linecap="round"/>
        <circle cx="0" cy="-90" r="8.5" fill="#D0CDF1"/><path d="M-10 -92a10 10 0 0 1 20 0z" fill="#F7FAFF"/><rect x="-11" y="-93" width="22" height="3" fill="#F7FAFF"/></g></g>`;
      s += fig("s4-wA") + fig("s4-wB");
      s += `</g>`;
      svg.innerHTML = s;

      // ---- camera ----
      gsap.set("#s4-cam", { svgOrigin: "990 600" });
      const cam = (c) => ({ scale: c.s, x: c.x, y: c.y });
      gsap.set("#s4-cam", cam(C0));
      const C1 = { s: 0.9, x: 232, y: -12 };
      tl.fromTo("#s4-cam", cam(C0), { ...cam(C1), duration: 1.1, ease: "power2.inOut" }, A(18.1));
      tl.to("#s4-cam", { scale: 0.587, x: 0, y: 0, duration: 0.8, ease: "power3.inOut" }, A(19.85));

      // ---- body appears, first panel lands (it arrives at sequence-3 scale and shrinks onto the membrane) ----
      tl.fromTo("#s4-body > g:not(#s4-p1)", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, A(14.6));
      const pc = P(c0[0] + 12, c0[1] + 5, h + 0.3);
      gsap.set("#s4-p1", { svgOrigin: `${pc[0]} ${pc[1]}` });
      tl.fromTo("#s4-p1", { scale: 21 / k, x: 902 - pc[0], y: 588 - pc[1], opacity: 1 }, { scale: 1, x: 0, y: 0, duration: 0.55, ease: "power4.out" }, A(14.6));
      tl.fromTo("#s4-adh", { opacity: 0 }, { opacity: 1, duration: 0.2 }, A(15.0));
      tl.fromTo("#s4-filet", { opacity: 1 }, { opacity: 1, duration: 0.01 }, A(15.15));
      tl.fromTo("#s4-fil1", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, A(15.15));
      tl.to("#s4-filet", { opacity: 0, duration: 0.5 }, A(15.9));

      FX.rise(tl, "#s4-h1 .ln > span", A(15.2), 0.5, 0.12);
      FX.rise(tl, "#s4-sub .ln > span", A(15.85), 0.45);

      // installers: one carries panel 2 in, the other lifts panel 3 alone; both set down without rebound
      const stand = (x, y) => I.p(x, y, h);
      const wA = stand(430, 560), wB = stand(454, 560), wAs = stand(540, 560), wBs = stand(560, 562);
      gsap.set("#s4-p2, #s4-p3", { opacity: 0 });
      gsap.set("#s4-p2", { svgOrigin: `${P(c1[0] + 12, c1[1] + 5, h)[0]} ${P(c1[0] + 12, c1[1] + 5, h)[1]}` });
      gsap.set("#s4-p3", { svgOrigin: `${P(c2[0] + 12, c2[1] + 5, h)[0]} ${P(c2[0] + 12, c2[1] + 5, h)[1]}` });
      const dxA = wAs[0] - wA[0], dyA = wAs[1] - wA[1], dxB = wBs[0] - wB[0], dyB = wBs[1] - wB[1];
      gsap.set("#s4-wA", { x: wA[0], y: wA[1] }); gsap.set("#s4-wB", { x: wB[0], y: wB[1] });
      tl.fromTo("#s4-wA", { x: wAs[0], y: wAs[1], opacity: 0 }, { x: wA[0], y: wA[1], opacity: 1, duration: 0.7, ease: "power2.out" }, A(15.55));
      tl.fromTo("#s4-wB", { x: wBs[0], y: wBs[1], opacity: 0 }, { x: wB[0], y: wB[1], opacity: 1, duration: 0.7, ease: "power2.out" }, A(15.75));
      tl.fromTo("#s4-p2", { x: dxA * 1, y: dyA - 58, opacity: 1 }, { x: 0, y: -58, duration: 0.7, ease: "power2.out" }, A(15.55));
      tl.to("#s4-p2", { y: 0, duration: 0.22, ease: "power3.in" }, A(16.3));
      tl.fromTo("#s4-p3", { x: dxB, y: dyB - 70, opacity: 1 }, { x: 0, y: -70, duration: 0.7, ease: "power2.out" }, A(15.75));
      tl.to("#s4-p3", { y: 0, duration: 0.22, ease: "power3.in" }, A(16.5));

      // cascade: row by row, front to back, around the lanterneaux
      let n = 0;
      for (let r = 11; r >= 0; r--) {
        const row = CEN.cells.filter((q) => q[3] === r && !(r === 11 && q[2] < 3));
        if (!row.length) continue;
        const t = 16.7 + n * 0.14; n++;
        tl.fromTo("#s4-row" + r, { opacity: 0 }, { opacity: 1, duration: 0.01 }, A(t));
        const mx = Math.max(...row.map((q) => q[0])) + 24 - Math.min(...row.map((q) => q[0]));
        tl.fromTo("#s4-rr" + r, { attr: { width: 0 } }, { attr: { width: mx }, duration: 0.55, ease: "power2.out" }, A(t));
      }
      FX.out(tl, ["#s4-h1", "#s4-sub"], A(17.35), 0.22);

      // certifications: three cards with a slight stagger, tied to the roof by thin lines; then one line of legend
      const ov = document.getElementById("s4-ov");
      const toS = (p) => [990 + C1.s * (p[0] - 990) + C1.x, 600 + C1.s * (p[1] - 600) + C1.y];
      const tg = [[985, 300], [975, 372], [965, 452]];
      const cards = [[1030, 236 + 28], [1030, 316 + 28], [1030, 396 + 28]];
      ov.innerHTML = cards.map((c, i) => `<g id="s4-ld${i + 1}" opacity="0"><path id="s4-ldp${i + 1}" d="M${c[0]} ${c[1]}L${f(tg[i][0])} ${f(tg[i][1])}" stroke="#00043E" stroke-width="1.4" fill="none" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><circle cx="${f(tg[i][0])}" cy="${f(tg[i][1])}" r="4.5" fill="#07BDF0" stroke="#00043E" stroke-width="1.2"/></g>`).join("");
      [1, 2, 3].forEach((i) => {
        const t = 18.5 + (i - 1) * 0.2;
        tl.fromTo("#s4-k" + i, { opacity: 0, y: 18, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, y: 0, clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, A(t));
        tl.fromTo("#s4-ld" + i, { opacity: 0 }, { opacity: 1, duration: 0.05 }, A(t + 0.1));
        tl.fromTo("#s4-ldp" + i, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, A(t + 0.1));
      });
      tl.fromTo("#s4-k4", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, A(19.1));
      // leave before the pull-out
      tl.to(["#s4-ld1", "#s4-ld2", "#s4-ld3"], { opacity: 0, duration: 0.2, ease: "power1.in" }, A(19.8));
      tl.to(["#s4-k1", "#s4-k2", "#s4-k3"], { opacity: 0, duration: 0.25, ease: "power1.in" }, A(20.05));
      tl.to("#s4-k4", { opacity: 0, duration: 0.2, ease: "power1.in" }, A(20.5));
      tl.to(["#s4-wA", "#s4-wB"], { opacity: 0, duration: 0.3 }, A(19.7));
      // the cut closes: the strips give way to the plain wall, the near parapets come in
      tl.to("#s4-strips", { opacity: 0, duration: 0.5 }, A(19.85));
      tl.fromTo("#s4-parN, #s4-parE", { opacity: 0 }, { opacity: 1, duration: 0.5 }, A(19.85));

      window.__timelines["s4"] = tl;
    })();
  </script>
</template>
