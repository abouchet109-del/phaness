  <script>
    const tl = gsap.timeline({ paused: true });
    const E = PH.EASE;

    // Layout: five sheets, 1920x1080, in two rows, read as an S.
    const P = [[240, 240], [2400, 240], [4560, 240], [4560, 1680], [2400, 1680]];
    const v = (i, x, y) => `${P[i][0] + x} ${P[i][1] + y}`;
    const rest = (i, o = {}) => ({ x: P[i][0] + 960, y: P[i][1] + 540, z: 0.93, rx: 0, ry: 0, rz: 0, ...o });
    const rng = ((a) => () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(11);
    const world = document.querySelector("#world");
    const GREEN = "#247855", MIST = "#dde5df";

    // Types a line character by character. Each character carries its own caret, so nothing depends on measured widths.
    function typeIn(sel, at, cps = 38) {
      const box = document.querySelector(sel + " .tx");
      const chars = Array.from(box.textContent);
      box.textContent = "";
      let last = null;
      chars.forEach((c, i) => {
        const s = document.createElement("span");
        s.className = "ty";
        const g = document.createElement("b");
        g.textContent = c;
        s.appendChild(g);
        const k = document.createElement("i");
        s.appendChild(k);
        box.appendChild(s);
        const t = at + i / cps;
        tl.set(g, { opacity: 1 }, t);
        tl.set(k, { opacity: 1 }, t);
        if (last) tl.set(last, { opacity: 0 }, t);
        last = k;
      });
      return { caret: last, end: at + chars.length / cps };
    }

    // The thread only exists once the request is sent.
    const th = PH.thread(tl, {
      paths: ["#thread"],
      head: "#head",
      segs: [
        ["send", `M ${v(0, 1672, 712)} L ${v(0, 1860, 712)}`],
        ["toB", `C ${v(0, 2020, 712)} ${v(0, 2000, 150)} ${v(1, 0, 150)} L ${v(1, 156, 150)}`],
        ["c1", `L ${v(1, 156, 520)} Q ${v(1, 156, 580)} ${v(1, 216, 580)} L ${v(1, 330, 580)}`],
        ["c2", `L ${v(1, 910, 580)}`],
        ["c3", `L ${v(1, 1540, 580)}`],
        ["toC", `L ${v(1, 1880, 580)} C ${v(1, 2040, 580)} ${v(1, 2000, 150)} ${v(2, 0, 150)} L ${v(2, 156, 150)}`],
        ["axis", `L ${v(2, 156, 820)} Q ${v(2, 156, 880)} ${v(2, 216, 880)} L ${v(2, 1630, 880)}`],
        ["rise", `Q ${v(2, 1670, 880)} ${v(2, 1670, 840)} L ${v(2, 1670, 360)}`],
        ["toD", `Q ${v(2, 1670, 290)} ${v(2, 1735, 290)} Q ${v(2, 1800, 290)} ${v(2, 1800, 355)} L ${v(2, 1800, 1240)} Q ${v(2, 1800, 1300)} ${v(2, 1740, 1300)} L ${v(2, 216, 1300)} Q ${v(2, 156, 1300)} ${v(2, 156, 1360)} L ${v(3, 156, 150)}`],
        ["r1", `L ${v(3, 156, 424)}`],
        ["r2", `L ${v(3, 156, 564)}`],
        ["r3", `L ${v(3, 156, 704)}`],
        ["toE", `L ${v(3, 156, 950)} Q ${v(3, 156, 1010)} ${v(3, 96, 1010)} L ${v(4, 1840, 1010)} Q ${v(4, 1780, 1010)} ${v(4, 1780, 950)} L ${v(4, 1780, 170)} Q ${v(4, 1780, 110)} ${v(4, 1720, 110)} L ${v(4, 216, 110)} Q ${v(4, 156, 110)} ${v(4, 156, 170)} L ${v(4, 156, 200)}`],
        ["e1", `L ${v(4, 156, 310)}`],
        ["e2", `L ${v(4, 156, 435)}`],
        ["e3", `L ${v(4, 156, 560)}`],
        ["e4", `L ${v(4, 156, 685)}`],
      ],
    });

    // Lifted objects
    gsap.set(".num", { z: 4 });
    gsap.set("#cur", { x: 2340, y: 1420, z: 90 });

    // ---- Sheet A: title, then the request (0 - 5.7)
    const cam = PH.camera(tl, rest(0, { x: 1240, y: 830, z: 1.03, rx: 7, ry: -5 }));
    cam.to(0, rest(0, { z: 0.95 }), 3.0, E.soft);
    cam.to(3.0, rest(0, { x: 1230, y: 810, z: 0.97 }), 2.7, E.soft);

    gsap.set("#prompt", { z: 280, y: -40, rotation: -2.5 });
    tl.to("#prompt", { z: 50, y: 0, rotation: 0, duration: 1.0, ease: E.land }, 0.05);
    PH.words(tl, "#t0", 0.5, { stagger: 0.09 });
    PH.rise(tl, "#b0", 0.85);
    PH.out(tl, "#t0,#b0", 2.45);

    gsap.set("#n1", { z: 4 });
    PH.pop(tl, "#n1", 2.55);
    PH.ink(tl, "#t1", 2.6, { stagger: 0.1 });

    gsap.set(".ul", { scaleX: 0 });
    gsap.set(".ptag", { opacity: 0, x: -24 });
    const tagIn = (u, g, at) => {
      tl.to(u, { scaleX: 1, duration: 0.3, ease: E.move }, at);
      tl.to(g, { opacity: 1, duration: 0.2, ease: "none" }, at + 0.1);
      tl.to(g, { x: 0, duration: 0.4, ease: E.arrive }, at + 0.1);
    };
    tl.set("#caret0", { opacity: 0 }, 2.8);
    const a1 = typeIn("#p1", 2.8);
    tagIn("#u1", "#g1", a1.end - 0.02);
    tl.set(a1.caret, { opacity: 0 }, a1.end + 0.08);
    const a2 = typeIn("#p2", a1.end + 0.08);
    tagIn("#u2", "#g2", a2.end - 0.02);
    tl.set(a2.caret, { opacity: 0 }, a2.end + 0.08);
    const a3 = typeIn("#p3", a2.end + 0.08);
    tagIn("#u3", "#g3", a3.end - 0.02);

    // The cursor presses send and the thread is born.
    tl.to("#cur", { x: 1912, y: 952, duration: 0.5, ease: E.move }, 4.7);
    tl.to("#send", { scale: 0.86, duration: 0.08, ease: "power2.out" }, 5.2);
    tl.to("#send", { scale: 1, duration: 0.25, ease: "power2.out" }, 5.28);
    tl.to("#prompt", { z: 40, duration: 0.08, ease: "power2.out" }, 5.2);
    tl.to("#prompt", { z: 50, duration: 0.3, ease: "power2.out" }, 5.28);
    tl.set(a3.caret, { opacity: 0 }, 5.23);
    tl.to("#cur", { x: 2020, y: 1120, duration: 0.5, ease: E.move }, 5.35);
    tl.set("#cur", { opacity: 0 }, 7.0);
    th.show(5.25);
    th.to(5.25, 0.42, "send", { ease: "power2.in" });

    // ---- Sheet B: the thread feeds three outputs (5.7 - 10.6)
    th.to(5.67, 1.08, "toB", { ease: "power2.out" });
    cam.travel(5.7, rest(1, { x: P[1][0] + 910, y: P[1][1] + 570, z: 0.97, rx: 5, ry: 4 }), 1.3, { via: { z: 0.68, rz: -2.5 } });
    cam.to(7.0, rest(1), 3.6, E.soft);
    PH.pop(tl, "#n2", 6.72);
    PH.words(tl, "#t2", 6.8);

    // Mosaic tiles over the picture: they clear in a seeded order, the image resolves.
    const mosaic = document.querySelector("#mosaic");
    const cols = 12, rows = 8, mw = 556 / cols, mh = 400 / rows;
    const motes = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const m = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      m.setAttribute("x", c * mw - 0.5); m.setAttribute("y", r * mh - 0.5);
      m.setAttribute("width", mw + 1); m.setAttribute("height", mh + 1);
      m.setAttribute("fill", rng() > 0.5 ? "#dde5df" : "#f1f4f2");
      mosaic.appendChild(m);
      motes.push(m);
    }
    motes.forEach((m) => tl.to(m, { opacity: 0, duration: 0.08, ease: "none" }, 7.95 + rng() * 0.85));

    // Table slots on the card; the cells themselves are world objects, because they leave.
    const tabEl = document.querySelector("#tab");
    const tiles = [];
    for (let r = 0; r < 6; r++) for (let c = 0; c < 3; c++) {
      const x = 32 + c * 148, y = 40 + r * 58;
      const s = document.createElement("div");
      s.className = "slot";
      s.style.left = x + "px"; s.style.top = y + "px";
      tabEl.appendChild(s);
      const t = document.createElement("div");
      t.className = "tile";
      t.id = "tile" + tiles.length;
      t.style.left = 3690 + x + "px"; t.style.top = 575 + y + "px";
      world.appendChild(t);
      tiles.push({ el: t, cx: 3690 + x + 70, cy: 575 + y + 25 });
    }
    gsap.set(".tile", { z: 41, clipPath: "inset(0 100% 0 0)" });

    const land = (sel, at, z, rot) => {
      gsap.set(sel, { z: 170, rotation: rot * 4, y: -30 });
      tl.to(sel, { z, rotation: rot, y: 0, duration: 0.55, ease: E.land }, at);
    };
    th.to(6.85, 0.4, "c1");
    land("#doc", 7.15, 46, -1.5);
