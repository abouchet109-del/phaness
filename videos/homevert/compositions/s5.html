<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #1D1C23; }
    #s5-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .s5-lab { position: absolute; margin: 0; top: 742px; text-align: center; font: 500 28px/1.25 "Poppins", sans-serif; color: #fff; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="s5" data-width="1920" data-height="1080" data-duration="5.2" data-layout-allow-overflow data-layout-allow-overlap>
    <svg id="s5-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="s5-line"></g>
      <g id="s5-mods"></g>
      <g id="s5-ols"></g>
      <g id="s5-pulse" opacity="0"><circle r="24" fill="rgba(70,192,143,.35)"/><circle r="9" fill="#D6F7E8"/></g>
    </svg>
    <p class="hv-t on-dark" id="s5-title" style="left: 96px; top: 116px; font-weight: 600; font-size: 48px; line-height: 1.16"><span class="ln"><span>Agir sur votre habitat</span></span></p>
    <p class="s5-lab" id="s5-l1" style="left: 96px; width: 540px">Solaire</p>
    <p class="s5-lab" id="s5-l2" style="left: 660px; width: 370px">Chauffage</p>
    <p class="s5-lab" id="s5-l3" style="left: 1054px; width: 370px">Façade &amp; toiture</p>
    <p class="s5-lab" id="s5-l4" style="left: 1448px; width: 370px">Isolation extérieure</p>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T0 = 16, A = (T) => T - T0, C = HV.C, S = HV.S;
      const BOT = 790;
      const M = [{ x: 96, y: 250, w: 540 }, { x: 660, y: 290, w: 370 }, { x: 1054, y: 290, w: 370 }, { x: 1448, y: 290, w: 370 }];
      // the progress line of sequence 4 is the common base of the four modules
      document.getElementById("s5-line").innerHTML = HV.trace("s5-tr", "M-20 800H1940");
      HV.setW(document.getElementById("s5-tr"), 1);
      gsap.set("#s5-tr", { opacity: 1 }); gsap.set("#s5-tr path", { strokeDashoffset: 0 });

      let mods = "", ols = "";
      M.forEach((m, i) => {
        const k = i + 1;
        const d = `M${m.x} ${BOT}V${m.y + 20}Q${m.x} ${m.y} ${m.x + 20} ${m.y}H${m.x + m.w - 20}Q${m.x + m.w} ${m.y} ${m.x + m.w} ${m.y + 20}V${BOT}`;
        ols += HV.trace("s5-o" + k, d) + `<path id="s5-hi${k}" d="${d}" fill="none" stroke="#B8F5D8" stroke-width="3" stroke-linejoin="round" opacity="0"/>`;
        mods += `<g id="s5-m${k}" opacity="0"><clipPath id="s5-cp${k}"><path d="M${m.x} ${BOT}V${m.y + 20}Q${m.x} ${m.y} ${m.x + 20} ${m.y}H${m.x + m.w - 20}Q${m.x + m.w} ${m.y} ${m.x + m.w} ${m.y + 20}V${BOT}Z"/></clipPath>
          <g clip-path="url(#s5-cp${k})"><rect x="${m.x}" y="${m.y}" width="${m.w}" height="${BOT - m.y}" fill="#373640"/><g id="s5-art${k}"></g><rect x="${m.x}" y="724" width="${m.w}" height="66" fill="#2B2A33"/></g></g>`;
      });
      document.getElementById("s5-mods").innerHTML = mods;
      document.getElementById("s5-ols").innerHTML = ols;
      M.forEach((m, i) => HV.setW(document.getElementById("s5-o" + (i + 1)), 1));

      // ---- module 1: solar. A piece of the roof with panels, same drawing as the house, cropped ----
      (function () {
        const I0 = new HV.Iso(66, 0, 0), q = I0.p(HV.rp(6.6, 2.7));
        const I = new HV.Iso(66, 366 - q[0], 497 - q[1]);
        document.getElementById("s5-art1").innerHTML = HV.house("m", I);
      })();
      gsap.set("#mrev", { x: 40 });
      tl.fromTo("#mglint", { x: 4.2 }, { x: 11.5, duration: 4.6, ease: "none" }, A(16.6));

      // ---- module 2: heat pump outdoor unit ----
      (function () {
        const x0 = 700, y0 = 460, w = 220, h = 240, dx = 44, dy = -26, cx = x0 + w / 2, cy = y0 + h / 2 - 6;
        let s = `<ellipse cx="${cx + 20}" cy="706" rx="150" ry="11" fill="rgba(0,0,0,.4)"/><rect x="680" y="700" width="330" height="24" fill="#2F2E37"/>`;
        s += `<polygon points="${x0},${y0} ${x0 + dx},${y0 + dy} ${x0 + w + dx},${y0 + dy} ${x0 + w},${y0}" fill="#EEF0F2"/>`;
        s += `<polygon points="${x0 + w},${y0} ${x0 + w + dx},${y0 + dy} ${x0 + w + dx},${y0 + h + dy} ${x0 + w},${y0 + h}" fill="#A9AEB6"/>`;
        s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#D8DBE0"/><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>`;
        s += `<path d="M${x0 + w + 12} ${y0 + 30}v176M${x0 + w + 24} ${y0 + 26}v176M${x0 + w + 36} ${y0 + 22}v176" stroke="#8E939B" stroke-width="3" stroke-linecap="round"/>`;
        s += `<circle cx="${cx}" cy="${cy}" r="92" fill="#C3C7CE"/><circle cx="${cx}" cy="${cy}" r="86" fill="#24252C"/>`;
        let bl = ""; for (let i = 0; i < 5; i++) bl += `<path d="M0 0C16-6 44-22 40-62C14-52-4-30 0 0Z" fill="#7B808B" stroke="#4E525C" stroke-width="2" transform="rotate(${i * 72})"/>`;
        s += `<g id="s5-fan" transform="translate(${cx} ${cy})">${bl}<circle r="13" fill="#B3B8C0"/></g>`;
        let rings = ""; [84, 64, 44].forEach((r) => (rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#C9CDD3" stroke-width="3.5"/>`));
        rings += `<path d="M${cx - 86} ${cy}H${cx + 86}M${cx} ${cy - 86}V${cy + 86}M${cx - 61} ${cy - 61}L${cx + 61} ${cy + 61}M${cx + 61} ${cy - 61}L${cx - 61} ${cy + 61}" stroke="#C9CDD3" stroke-width="2.5"/>`;
        s += rings;
        for (let i = 0; i < 5; i++) s += `<rect x="${x0 + 26}" y="${y0 + h - 34 + i * 6}" width="${w - 52}" height="2.5" rx="1" fill="#8E939B"/>`;
        s += `<rect x="${x0 + 14}" y="${y0 + h}" width="44" height="8" fill="#15151A"/><rect x="${x0 + w - 58}" y="${y0 + h}" width="44" height="8" fill="#15151A"/>`;
        s += `<rect x="${x0 + w - 36}" y="${y0 + 12}" width="22" height="9" rx="3" fill="#0B8457"/>`;
        // refrigerant lines leave the side of the unit and climb to the wall plate
        s += `<path d="M${x0 + w + dx} ${y0 + h - 70}H1000Q1012 ${y0 + h - 70} 1012 ${y0 + h - 82}V520" fill="none" stroke="#8E939B" stroke-width="15" stroke-linecap="round"/><path d="M${x0 + w + dx} ${y0 + h - 70}H1000Q1012 ${y0 + h - 70} 1012 ${y0 + h - 82}V520" fill="none" stroke="#C97F50" stroke-width="7" stroke-linecap="round"/>`;
        s += `<rect x="1002" y="500" width="28" height="44" fill="#D9CBAE"/><rect x="1004" y="640" width="16" height="10" rx="2" fill="#6C717C"/><rect x="1004" y="560" width="16" height="10" rx="2" fill="#6C717C"/>`;
        document.getElementById("s5-art2").innerHTML = s;
      })();
      tl.to("#s5-fan", { rotation: 220, svgOrigin: "810 574", duration: 4.4, ease: "none" }, A(16.8));

      // ---- module 3: corner of a facade and a roof rim; the renovated surface is revealed by a clean pass ----
      (function () {
        const I = new HV.Iso(64, 0, 0), q = I.p(1.6, 1.3, 1.4), tx = 1239, ty = 520;
        const J = new HV.Iso(64, tx - q[0], ty - q[1]);
        const Wd = 3.2, Dd = 2.4, Hz = 2.6, yr = 1.1, zr = Hz + (Dd + 0.3 - yr) * Math.tan(Math.PI / 6);
        const roofPts = (z0) => [[-0.3, Dd + 0.3, Hz - 0.17 + z0], [Wd + 0.3, Dd + 0.3, Hz - 0.17 + z0], [Wd + 0.3, yr, zr + z0], [-0.3, yr, zr + z0]];
        const scene = (pre, c) => {
          let s = "";
          s += J.poly([[0, Dd, 0], [Wd, Dd, 0], [Wd, Dd, Hz], [0, Dd, Hz]], c.wl);
          s += J.poly([[Wd, 0, 0], [Wd, Dd, 0], [Wd, Dd, Hz], [Wd, yr, zr - 0.17], [Wd, 0, Hz]], c.wr);
          s += J.poly(roofPts(0), `url(#${pre}t)`);
          s += J.poly([[Wd + 0.3, Dd + 0.3, Hz - 0.17], [Wd + 0.3, yr, zr], [Wd + 0.3, yr, zr - 0.2], [Wd + 0.3, Dd + 0.3, Hz - 0.37]], c.rim);
          s += J.poly([[-0.3, Dd + 0.3, Hz - 0.17], [Wd + 0.3, Dd + 0.3, Hz - 0.17], [Wd + 0.3, Dd + 0.3, Hz - 0.37], [-0.3, Dd + 0.3, Hz - 0.37]], c.fa);
          return s;
        };
        const defs = (pre, a, b, c2) => `<pattern id="${pre}t" patternUnits="userSpaceOnUse" width="32" height="20"><rect width="32" height="20" fill="${a}"/><rect width="16" height="10" fill="${b}"/><rect x="16" y="10" width="16" height="10" fill="${b}"/><path d="M0 10H32M0 20H32" stroke="${c2}" stroke-opacity=".6" stroke-width="2"/></pattern>`;
        let s = `<defs>${defs("o", "#8F5B49", "#7E4C3C", "#3A1D12")}${defs("n", "#B2573B", "#BA5E41", "#5C2415")}
          <pattern id="nj" patternUnits="userSpaceOnUse" width="40" height="22"><path d="M0 0.5H40" stroke="#B7A882" stroke-opacity=".55" stroke-width="1.2"/></pattern>
          <linearGradient id="fwg" gradientUnits="userSpaceOnUse" x1="-90" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
          <mask id="fmask" maskUnits="userSpaceOnUse" x="900" y="250" width="700" height="520"><g id="s5-fw"><rect x="-400" y="-200" width="800" height="1300" fill="url(#fwg)" transform="translate(0 0)"/></g></mask></defs>`;
        s += J.poly([[-0.9, -0.6, 0], [Wd + 0.9, -0.6, 0], [Wd + 0.9, Dd + 0.9, 0], [-0.9, Dd + 0.9, 0]], "rgba(0,0,0,.3)");
        s += `<g>${scene("o", { wl: "#A99A7C", wr: "#8F8265", rim: "#4D2A20", fa: "#9DA0A6" })}</g>`;
        // weathering on the old surface: stains and a crack
        s += `<g transform="${J.faceY(Dd, 0)}"><path d="M0.4 2.5L0.9 1.9L0.8 1.4L1.3 0.9" fill="none" stroke="#4E4635" stroke-width="0.03" stroke-linecap="round"/><ellipse cx="1.9" cy="2.2" rx="0.5" ry="0.3" fill="#5C5440" fill-opacity=".45"/><ellipse cx="0.6" cy="0.5" rx="0.45" ry="0.25" fill="#5C5440" fill-opacity=".4"/><ellipse cx="2.7" cy="0.8" rx="0.3" ry="0.5" fill="#5C5440" fill-opacity=".35"/></g>`;
        s += `<g mask="url(#fmask)">${scene("n", { wl: "#E3D8BE", wr: "#C9BC9F", rim: "#8A3E2A", fa: "#F2F2F4" })}`;
        let jn = ""; for (let z = 0.3; z < Hz; z += 0.3) jn += `M0 ${z.toFixed(2)}H${Wd}`;
        s += `<g transform="${J.faceY(Dd, 0)}"><path d="${jn}" stroke="#B7A882" stroke-opacity=".55" stroke-width="0.012"/></g>`;
        s += `<path d="M${[J.p(Wd, Dd, 0), J.p(Wd, Dd, Hz)].map((p) => p.join(",")).join("L")}" stroke="#fff" stroke-opacity=".85" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`;
        document.getElementById("s5-art3").innerHTML = s;
      })();
      // a clean pass travels from the lower left to the upper right
      tl.fromTo("#s5-fw", { x: 1000, y: 0 }, { x: 1560, y: 0, duration: 1.6, ease: "power2.inOut" }, A(17.6));

      // ---- module 4: external insulation. Three layers move apart by a few virtual centimetres, then rejoin ----
      (function () {
        const k = 62, I0 = new HV.Iso(k, 0, 0), q = I0.p(1.2, 0.95, 1.6), I = new HV.Iso(k, 1633 - q[0], 520 - q[1]);
        const w = 2.4, h = 3.0;
        const defs = `<defs><pattern id="brk" patternUnits="userSpaceOnUse" width="0.5" height="0.2"><rect width="0.5" height="0.2" fill="#9A5B47"/><path d="M0 0.1H0.5M0 0.2H0.5" stroke="#4A2A20" stroke-width="0.02"/><path d="M0.25 0V0.1M0 0.1V0.2" stroke="#4A2A20" stroke-width="0.02"/></pattern>
          <pattern id="ins" patternUnits="userSpaceOnUse" width="0.1" height="0.1"><rect width="0.1" height="0.1" fill="#EFE8CF"/><circle cx="0.03" cy="0.03" r="0.012" fill="#C9BE98"/><circle cx="0.08" cy="0.07" r="0.01" fill="#C9BE98"/></pattern></defs>`;
        const layer = (id, y, d, top, r, fr, front) => `<g id="${id}">${I.box(0, y, 0, w, d, h, { top, l: top, r })}<g transform="${I.faceY(y + d, 0)}"><rect x="0" y="0" width="${w}" height="${h}" fill="${fr}"/>${front || ""}</g></g>`;
        let s = defs + I.poly([[-0.5, -0.4, 0], [w + 0.6, -0.4, 0], [w + 0.6, 2.4, 0], [-0.5, 2.4, 0]], "rgba(0,0,0,.28)");
        s += layer("s5-ly1", 0, 0.7, "#B9735D", "#6F3C2D", "url(#brk)");
        let dw = ""; [[0.5, 0.6], [1.2, 0.6], [1.9, 0.6], [0.5, 1.5], [1.2, 1.5], [1.9, 1.5], [0.5, 2.4], [1.2, 2.4], [1.9, 2.4]].forEach((p) => (dw += `<circle cx="${p[0]}" cy="${p[1]}" r="0.055" fill="#8E939B" stroke="#5E626B" stroke-width="0.012"/>`));
        s += layer("s5-ly2", 0.7, 0.55, "#F3EDD7", "#CFC6A4", "url(#ins)", dw);
        s += layer("s5-ly3", 1.25, 0.14, "#E3D8BE", "#B9AD8E", "#E3D8BE", `<path d="M0 1.5H${w}M1.2 0V${h}" stroke="#B7A882" stroke-opacity=".6" stroke-width="0.015"/>`);
        document.getElementById("s5-art4").innerHTML = s;
        // layers slide apart along the depth axis (towards the viewer, lower left) then come back
        const off = (g) => ({ x: -C * k * g, y: S * k * g });
        [["#s5-ly2", 0.75], ["#s5-ly3", 1.5]].forEach(([id, g]) => {
          const o = off(g);
          tl.fromTo(id, { x: 0, y: 0 }, { x: o.x, y: o.y, duration: 0.8, ease: "power3.inOut" }, A(18.0));
          tl.to(id, { x: 0, y: 0, duration: 0.8, ease: "power3.inOut" }, A(19.4));
        });
      })();

      // ---- timeline ----
      // the line draws four contours, one after another, on the common base
      M.forEach((m, i) => HV.draw(tl, "s5-o" + (i + 1), A(16.0) + i * 0.2, 0.55, 0, 1, "power2.inOut"));
      // the modules arrive with a slight offset, then stay together
      M.forEach((m, i) => {
        tl.fromTo("#s5-m" + (i + 1), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, A(16.35) + i * 0.22);
        HV.FX.lines(tl, "#s5-l" + (i + 1), A(16.75) + i * 0.22, 0.45, 0);
      });
      HV.FX.lines(tl, "#s5-title .ln > span", A(17.5), 0.55, 0);
      // the green line circulates between the modules: a light passes along the base, each contour answers
      const po = { x: 60 };
      tl.set("#s5-pulse", { opacity: 1 }, A(17.9));
      tl.to(po, { x: 1880, duration: 1.7, ease: "power1.inOut", onUpdate() { document.getElementById("s5-pulse").setAttribute("transform", `translate(${po.x} 800)`); } }, A(17.9));
      tl.set("#s5-pulse", { opacity: 0 }, A(19.65));
      M.forEach((m, i) => {
        const tpass = 17.9 + 1.7 * (0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, (m.x + m.w / 2 - 60) / 1820)) ) ;
        tl.to("#s5-hi" + (i + 1), { opacity: 0.85, duration: 0.25, ease: "power2.out" }, A(tpass) - 0.1);
        tl.to("#s5-hi" + (i + 1), { opacity: 0, duration: 0.6, ease: "power2.inOut" }, A(tpass) + 0.15);
      });
      // transition: the modules come together onto one stable base line
      tl.to("#s5-mods, #s5-ols", { scaleY: 0.001, svgOrigin: "960 790", opacity: 0, duration: 0.6, ease: "power3.in" }, A(20.4));
      tl.to("#s5-l1, #s5-l2, #s5-l3, #s5-l4, #s5-title", { opacity: 0, duration: 0.3, ease: "power2.in" }, A(20.35));
      window.__timelines["s5"] = tl;
    })();
  </script>
</template>
