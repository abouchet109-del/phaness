<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/phaness.js"></script>
    <link rel="stylesheet" href="assets/phaness.css" />
    <style>
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f5f7f4; font-family: "Geist", sans-serif; }
    </style>
  </head>
  <body>
    <!-- Set data-duration to the film's length on all three lines (here and in compositions/film.html). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="film" data-composition-id="film" data-composition-src="compositions/film.html"
        data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
