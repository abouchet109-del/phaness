          <div class="ph-tag label" id="l6" style="left: 1560px; top: 110px">Air usé</div>

        <!-- Sheet 3: adapt the heating -->
        <div class="ph-sheet" id="s3" style="left: 4560px; top: 1680px" data-layout-allow-overflow>
          <div class="ground"></div>
          <svg class="house" width="1060" height="1080" style="left: 120px" data-layout-allow-overflow>
            <g class="base"></g>
            <g class="fill-tints"></g>
            <g class="fill-band-mute"></g>

            <path class="heat3 ph-line" d="M 530 705 V 548 H 480" stroke="#247855" stroke-width="6" />
            <path class="heat3 ph-line" d="M 530 548 H 590" stroke="#247855" stroke-width="6" />

            <rect x="470" y="705" width="120" height="200" rx="10" fill="none" stroke="#52615a" stroke-width="4" stroke-dasharray="12 10" />
          </svg>
          <div class="ph-h1" id="t3" style="left: 1120px; top: 120px; width: 560px">Adapter le chauffage</div>
          <div class="ph-body" id="b3" style="left: 1120px; top: 350px">Un équipement à la mesure<br />d'une maison mieux isolée.</div>

        <!-- Sheet 4: comfort, then the call -->
        <div class="ph-sheet" id="s4" style="left: 2400px; top: 1680px" data-layout-allow-overflow>
          <div class="ground"></div>
          <svg class="house" width="1060" height="1080" style="left: 120px" data-layout-allow-overflow>
            <g class="base"></g>

            <g id="f1"><g transform="translate(-40 -208) scale(0.4)"><use href="#fig" /></g></g>
            <g id="f2"><g transform="translate(-32 -166) scale(0.32)"><use href="#fig" /></g></g>
          </svg>
          <div class="ph-h1" id="t4" style="left: 1120px; top: 300px; width: 520px">Améliorer le confort</div>
          <div class="ph-body" id="b4" style="left: 1120px; top: 530px">Une maison plus agréable<br />à vivre, pièce après pièce.</div>
          <div class="ph-h1" id="t5" style="left: 1120px; top: 400px; width: 680px">Et chez vous ?</div>
          <div class="ph-body" id="b5" style="left: 1120px; top: 530px">Un projet adapté<br />à votre logement.</div>
        </div>

        <!-- Thread above the sheets. Lifted objects are direct children of #world, higher in z. -->
        <svg class="ph-layer" width="6800" height="3000" style="transform: translateZ(2px)" data-layout-allow-overflow>
          <defs>

                <path d="M143 150 L166 282" stroke-width="28" />

                <path d="M120 300 L124 486" stroke-width="38" />
              </g>
              <rect x="50" y="118" width="100" height="190" rx="38" fill="#14251d" />
              <circle cx="100" cy="66" r="42" fill="#14251d" />
            </g>
          </defs>

        <!-- Lifted: the magnifier -->
        <div id="loupe-sh"></div>

        <!-- Lifted: the three layers that land on the last house -->
        <svg class="plate" id="p-band" width="1060" height="1080" style="left: 2520px; top: 1680px" data-layout-allow-overflow><g class="fill-band-live"></g></svg>
        <svg class="plate" id="p-air" width="1060" height="1080" style="left: 2520px; top: 1680px" data-layout-allow-overflow><g class="fill-air-live"></g><g class="fill-vmc"></g></svg>
        <svg class="plate" id="p-heat" width="1060" height="1080" style="left: 2520px; top: 1680px" data-layout-allow-overflow>
          <path class="ph-line" d="M 530 705 V 548 H 480 M 530 548 H 590 M 590 895 H 610 M 470 895 H 84" stroke="#247855" stroke-width="6" />
          <g class="fill-rads-on"></g>
          <rect x="470" y="705" width="120" height="200" rx="10" fill="#fff" stroke="#14251d" stroke-width="5" />
          <rect x="487" y="726" width="80" height="34" rx="6" fill="#dde5df" />
          <circle cx="527" cy="743" r="10" fill="#247855" />
          <path d="M 489 806 H 565 M 489 826 H 565 M 489 846 H 565 M 489 866 H 565" fill="none" stroke="#14251d" stroke-width="5" stroke-linecap="round" />

    <div id="end" class="ph-end"><div class="ph-logo">phaness</div><div class="ph-sign">Donnez vie à vos idées en vidéo.</div></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const E = PH.EASE;

    // Layout: five sheets in an S. The house sits right of the text on the top row, left of it on the bottom row.
    const P = [[240, 240], [2400, 240], [4560, 240], [4560, 1680], [2400, 1680]];
    const HX = [860, 860, 860, 120, 120];
    const v = (i, x, y) => `${P[i][0] + x} ${P[i][1] + y}`;
    const h = (i, x, y) => `${P[i][0] + HX[i] + x} ${P[i][1] + y}`;
    const rest = (i, o = {}) => ({ x: P[i][0] + 960, y: P[i][1] + 540, z: 0.93, rx: 0, ry: 0, rz: 0, ...o });
    const $all = (s) => document.querySelectorAll(s);
    const put = (s, html) => $all(s).forEach((el) => { el.innerHTML = html; });

    // The house and its layers, shared by every sheet.
    put(".base", `
      <g class="flats">
        <rect x="130" y="835" width="170" height="70" rx="12" /><rect x="130" y="790" width="30" height="115" rx="10" />
        <path d="M 319 905 V 775 H 325 V 905 Z" /><path d="M 300 775 L 344 775 L 334 738 L 310 738 Z" />
        <rect x="680" y="825" width="130" height="80" rx="4" /><rect x="690" y="650" width="120" height="70" rx="4" />
        <rect x="130" y="510" width="220" height="50" rx="10" /><rect x="130" y="470" width="18" height="90" rx="6" />
        <rect x="690" y="505" width="120" height="55" rx="20" /><rect x="796" y="478" width="8" height="30" rx="3" />
      </g>
      <g fill="#fff">
        <rect x="722" y="825" width="4" height="80" /><rect x="766" y="825" width="4" height="80" /><rect x="748" y="650" width="4" height="70" />
        <rect x="156" y="517" width="62" height="24" rx="8" />
      </g>
      <g class="lines">
        <path d="M 101 925 V 340" stroke-width="22" />
        <path d="M 80 345 L 470 120 L 860 345" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" />
        <path d="M 839 340 V 925" stroke-width="22" />
        <path d="M 90 915 H 850" stroke-width="20" />
        <path d="M 112 569 H 828" stroke-width="18" />
        <path d="M 112 351 H 828" stroke-width="12" />
        <path d="M 440 578 V 760" stroke-width="12" />
        <path d="M 560 357 V 450" stroke-width="12" />
      </g>
      <g class="wins">
        <rect x="88" y="650" width="26" height="130" /><rect x="88" y="410" width="26" height="100" />
        <rect x="826" y="410" width="26" height="100" /><rect x="826" y="650" width="26" height="130" />
      </g>`);
    const band = (p) => `
      <path class="bw" d="M 77 924 V 319 L 470 92 L 863 319 V 924" fill="none" stroke="${p}" stroke-width="26" stroke-dasharray="6 8" />
      <path class="bf" d="M 64 937 H 876" fill="none" stroke="${p}" stroke-width="26" stroke-dasharray="6 8" />`;
    const airMain = "M 64 620 L 340 620 C 420 620 380 830 470 830 L 590 830 C 650 830 650 800 650 760 L 650 345";
    const airUp = "M 64 385 L 470 385 C 530 385 520 470 580 470 L 625 470 Q 650 470 650 445";
    const air = (c) => `<path class="ph-line" d="${airMain}" stroke="${c}" stroke-width="6" /><path class="ph-line" d="${airUp}" stroke="${c}" stroke-width="6" />`;
    const rad = (x, y, w, hh, c) => {
      let ribs = "";
      for (let k = x + 14; k < x + w - 6; k += 14) ribs += `M ${k} ${y} V ${y + hh} `;
      return `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="6" fill="${c}" /><path d="${ribs}" stroke="#fff" stroke-width="4" fill="none" />`;
    };
    const RADS = [[350, 830, 80, 65], [610, 830, 60, 65], [400, 490, 80, 60], [590, 490, 50, 60]];
    put(".fill-band-mute", band("#c9d4cd"));
    put(".fill-band-live", band("#247855"));
    put(".fill-air-mute", air("#c9d4cd"));
    put(".fill-air-live", air("#247855"));
    put(".fill-rads-off", RADS.map((r) => rad(...r, "#c9d4cd")).join(""));
    put(".fill-rads-on", RADS.map((r) => rad(...r, "#247855")).join(""));
    put("#rads3", RADS.map((r) => `<g class="r-on">${rad(...r, "#247855")}</g>`).join(""));
    put("#band1", band("#247855"));
    put(".fill-vmc", `
      <rect x="610" y="285" width="120" height="58" rx="8" fill="#fff" stroke="#14251d" stroke-width="5" />
      <circle cx="690" cy="314" r="22" fill="#dde5df" />
      <g class="fan"><path d="M 690 314 Q 676 296 690 292 Q 704 296 690 314 Q 712 314 712 328 Q 700 338 690 314 Q 668 328 668 314 Q 672 302 690 314" fill="#14251d" /></g>
      <rect x="636" y="152" width="28" height="44" fill="#fff" stroke="#14251d" stroke-width="5" /><rect x="626" y="140" width="48" height="13" rx="4" fill="#14251d" />`);
    put(".fill-tints", `
      <rect class="tint" x="112" y="578" width="328" height="327" /><rect class="tint" x="440" y="578" width="388" height="327" />
      <rect class="tint" x="112" y="357" width="448" height="203" /><rect class="tint" x="560" y="357" width="268" height="203" />`);
    document.querySelector("#air-up").setAttribute("d", airUp);

    // Green window frames on sheet 1.
    $all(".w-on").forEach((r) => { r.setAttribute("fill", "#fff"); r.setAttribute("stroke", "#247855"); r.setAttribute("stroke-width", "7"); });

    // Heat escaping on sheet 1: dashed grey arrows that flow until the insulation reaches them.
    const LEAKS = [
      [120, 730, -30, 730, 6.44], [120, 470, -30, 470, 6.67], [270, 235, 200, 114, 6.92], [400, 160, 330, 39, 7.01],
      [620, 207, 690, 86, 7.14], [820, 470, 970, 470, 7.42], [820, 730, 970, 730, 7.66], [300, 900, 300, 1030, 8.15], [640, 900, 640, 1030, 8.42],
    ];
    put("#leaks", LEAKS.map(([x0, y0, x1, y1]) => {
      const a = Math.atan2(y1 - y0, x1 - x0), s = 26;
      const pt = (ang, r) => `${x1 + r * Math.cos(ang)} ${y1 + r * Math.sin(ang)}`;
      return `<g class="leak"><path class="flow" d="M ${x0} ${y0} L ${x1 - 16 * Math.cos(a)} ${y1 - 16 * Math.sin(a)}" fill="none" stroke="#52615a" stroke-width="12" stroke-dasharray="24 16" />
        <path d="M ${pt(a, s)} L ${pt(a + 2.4, s)} L ${pt(a - 2.4, s)} Z" fill="#52615a" /></g>`;
    }).join(""));

    const cam = PH.camera(tl, rest(0, { z: 1.02, ry: -4 }));
    const th = PH.thread(tl, {
      paths: ["#thread"],
      head: "#head",
      segs: [
        ["a_ground", `M ${v(0, 0, 950)} L ${h(0, 84, 950)}`],
        ["a_env", `L ${h(0, 84, 326)} L ${h(0, 470, 104)} L ${h(0, 856, 326)} L ${h(0, 856, 950)}`],
        ["b_ground", `L ${h(1, 64, 950)}`],
        ["b_env", `L ${h(1, 64, 312)} L ${h(1, 470, 77)} L ${h(1, 876, 312)} L ${h(1, 876, 950)}`],
        ["c_ground", `L ${h(2, 0, 950)} Q ${h(2, 40, 950)} ${h(2, 40, 910)} L ${h(2, 40, 660)} Q ${h(2, 40, 620)} ${h(2, 80, 620)}`],
        ["c_room", `L ${h(2, 340, 620)} C ${h(2, 420, 620)} ${h(2, 380, 830)} ${h(2, 470, 830)} L ${h(2, 590, 830)} C ${h(2, 650, 830)} ${h(2, 650, 800)} ${h(2, 650, 760)}`],
        ["c_up", `L ${h(2, 650, 120)}`],
        ["c_arc", `C ${h(2, 650, 40)} ${h(2, 750, 30)} ${h(2, 830, 30)} L ${v(2, 1900, 30)} C ${v(2, 1980, 30)} ${v(2, 2000, 90)} ${v(2, 2000, 200)} L ${v(3, 2000, 760)} C ${v(3, 2000, 900)} ${v(3, 1960, 950)} ${v(3, 1820, 950)}`],
        ["d_in", `L ${h(3, 545, 950)} Q ${h(3, 530, 950)} ${h(3, 530, 935)} L ${h(3, 530, 895)}`],
        ["d_floor", `L ${h(3, 64, 895)}`],
        ["d_out", `C ${h(3, 30, 895)} ${h(3, 30, 950)} ${h(3, -10, 950)} L ${v(3, 0, 950)} L ${v(4, 1920, 950)}`],
        ["e_end", `L ${h(4, 876, 950)}`],
      ],
    });

    // ---- Sheet 0: the thread draws the house, the magnifier looks it over (0 - 4.3)
    gsap.set("#s0 .flats, #s0 .wins", { opacity: 0 });
    th.show(0.15).to(0.15, 0.95, "a_ground", { ease: "power2.in" }).to(1.1, 1.3, "a_env", { ease: "power1.inOut" });
    PH.letters(tl, "#t0", 0.35, { stagger: 0.04 });
    PH.ink(tl, "#b0", 0.95);
    const L0 = $all("#s0 .lines path");
    [[1.15, 0.45], [1.5, 0.55], [1.95, 0.42], [2.05, 0.4], [2.15, 0.4], [2.25, 0.35], [2.3, 0.3], [2.35, 0.3]].forEach(([at, dur], i) => PH.draw(tl, L0[i], at, { dur }));
    tl.to("#s0 .flats, #s0 .wins", { opacity: 1, duration: 0.5, ease: "none" }, 2.0);
    cam.to(0, rest(0), 4.3, E.soft);

    const LOUPE = [[290, 220, 2.0], [101, 730, 2.55], [300, 460, 3.1], [640, 760, 3.65]];
    const lp = (x, y) => ({ x: P[0][0] + HX[0] + x, y: P[0][1] + y });
    const LOUPE_DX = -170, LOUPE_DY = -170, SH_DX = -60, SH_DY = -40;
    gsap.set("#loupe", { x: lp(760, 1250).x + LOUPE_DX, y: lp(760, 1250).y + LOUPE_DY, z: 70 });
    gsap.set("#loupe-sh", { x: lp(760, 1250).x + SH_DX, y: lp(760, 1250).y + SH_DY, z: 1, opacity: 0 });
    tl.to("#loupe-sh", { opacity: 1, duration: 0.3, ease: "none" }, 1.5);
    LOUPE.forEach(([x, y, at], i) => {
      const p = lp(x, y), d = i ? 0.42 : 0.55;
      tl.to("#loupe", { x: p.x + LOUPE_DX, y: p.y + LOUPE_DY, duration: d, ease: E.move }, at - d);
      tl.to("#loupe-sh", { x: p.x + SH_DX, y: p.y + SH_DY, duration: d, ease: E.move }, at - d);
      PH.pop(tl, `#m${i + 1}`, at - 0.08, { dur: 0.3 });
      PH.rise(tl, `#l${i + 1}`, at + 0.16, { dur: 0.35, y: 12 });
    });
    const gone = lp(760, 1250);
    tl.to("#loupe", { x: gone.x + LOUPE_DX, y: gone.y + LOUPE_DY, duration: 0.45, ease: E.exit }, 3.9);
    tl.to("#loupe-sh", { x: gone.x + SH_DX, y: gone.y + SH_DY, duration: 0.45, ease: E.exit }, 3.9);
    tl.set("#loupe, #loupe-sh", { opacity: 0 }, 4.36);

    // ---- Sheet 1: losses, then the insulation follows the thread (4.3 - 9.4)
    th.to(4.1, 1.5, "b_ground");
    cam.travel(4.3, rest(1, { z: 0.9, ry: 5 }), 1.2, { via: { z: 0.62, rx: 14, rz: -3 } });
    cam.to(5.5, rest(1, { z: 0.96 }), 3.9, E.soft);
    $all("#leaks .leak").forEach((g, i) => {
      const [x0, y0, , , at] = LEAKS[i];
      gsap.set(g, { svgOrigin: `${x0} ${y0}` });
      tl.to(g.querySelector(".flow"), { attr: { "stroke-dashoffset": -40 * 8 }, duration: at - 3.8, ease: "none" }, 3.8);
