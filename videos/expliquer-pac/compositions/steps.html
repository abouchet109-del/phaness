<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="steps" data-width="1920" data-height="1080">
    <div id="pac-counter" class="ph-counter">
      <div id="pac-disc" class="ph-disc" data-layout-allow-overflow>
        <div id="pac-digits" class="ph-digits"><span>1</span><span>2</span><span>3</span><span>4</span></div>
      </div>
      <span id="pac-of" class="ph-of">/ 4</span>
    </div>

    <div id="pac-t1" class="ph-step clip" data-start="0" data-duration="4.2" data-track-index="1">
      <h2 id="pac-t1-title" class="ph-step-title">Évaporation</h2>
      <p id="pac-t1-sub" class="ph-step-sub">Les calories de l’air extérieur font s’évaporer le <b>fluide frigorigène</b>.</p>
    </div>
    <div id="pac-t2" class="ph-step clip" data-start="4.2" data-duration="4.2" data-track-index="1">
      <h2 id="pac-t2-title" class="ph-step-title">Compression</h2>
      <p id="pac-t2-sub" class="ph-step-sub">Le compresseur élève sa <b>température</b>.</p>
    </div>
    <div id="pac-t3" class="ph-step clip" data-start="8.4" data-duration="4.2" data-track-index="1">
      <h2 id="pac-t3-title" class="ph-step-title">Condensation</h2>
      <p id="pac-t3-sub" class="ph-step-sub">Le condenseur transmet la chaleur à <b>l’eau du chauffage</b>.</p>
    </div>
    <div id="pac-t4" class="ph-step clip" data-start="12.6" data-duration="5.4" data-track-index="1">
      <h2 id="pac-t4-title" class="ph-step-title">Détente</h2>
      <p id="pac-t4-sub" class="ph-step-sub">Le détendeur abaisse la pression et <b>relance le cycle</b>.</p>
    </div>

    <div class="ph-progress">
      <div class="ph-seg"><i id="pac-p1"></i></div>
      <div class="ph-seg"><i id="pac-p2"></i></div>
      <div class="ph-seg"><i id="pac-p3"></i></div>
      <div class="ph-seg"><i id="pac-p4"></i></div>
    </div>

    <div class="ph-stage" data-layout-allow-overflow>
      <svg viewBox="0 0 780 860">
        <defs>
          <radialGradient id="pac-cw" cx="36%" cy="22%" r="85%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.55" stop-color="#f5f7fb" />
            <stop offset="1" stop-color="#d3dbe9" />
          </radialGradient>
          <linearGradient id="pac-base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fdfeff" />
            <stop offset="1" stop-color="#d9e0ec" />
          </linearGradient>
          <radialGradient id="pac-night" cx="32%" cy="22%" r="90%">
            <stop offset="0" stop-color="#3a4c78" />
            <stop offset="0.55" stop-color="#16244a" />
            <stop offset="1" stop-color="#0b1633" />
          </radialGradient>
          <radialGradient id="pac-white" cx="34%" cy="24%" r="90%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.6" stop-color="#f1f4fa" />
            <stop offset="1" stop-color="#cfd8e7" />
          </radialGradient>
          <radialGradient id="pac-mist" cx="40%" cy="30%" r="80%">
            <stop offset="0" stop-color="#eef2f8" />
            <stop offset="1" stop-color="#cdd6e6" />
          </radialGradient>
          <filter id="pac-soft" x="-40%" y="-40%" width="180%" height="200%">
            <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#0b1633" flood-opacity="0.15" />
          </filter>
        </defs>

        <g id="pac-plinth" filter="url(#pac-soft)">
          <circle cx="160" cy="800" r="80" fill="url(#pac-cw)" />
          <circle cx="330" cy="780" r="105" fill="url(#pac-cw)" />
          <circle cx="510" cy="795" r="90" fill="url(#pac-cw)" />
          <rect x="70" y="800" width="560" height="80" rx="40" fill="url(#pac-base)" />
        </g>

        <!-- The refrigerant circuit: a clay pipe, then the fluid as moving dots, one segment per step. -->
        <path id="pac-pipe" d="M120 440 V300 A70 70 0 0 1 190 230 H460 A70 70 0 0 1 530 300 V580 A70 70 0 0 1 460 650 H190 A70 70 0 0 1 120 580 Z"
          fill="none" stroke="#dce3f0" stroke-width="28" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1" />
        <g fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 23">
          <path id="pac-fa" d="M120 440 V300 A70 70 0 0 1 190 230 H355" stroke="#4a5878" />
          <path id="pac-fb" d="M355 230 H460 A70 70 0 0 1 530 300 V440" stroke="#e34234" />
          <path id="pac-fc" d="M530 440 V580 A70 70 0 0 1 460 650 H325" stroke="#ef8b7f" />
          <path id="pac-fd" d="M325 650 H190 A70 70 0 0 1 120 580 V440" stroke="#93a6cc" />
        </g>

        <!-- 1. Outdoor air and the evaporator -->
        <g id="pac-air" fill="none" stroke="#93a6cc" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 14">
          <path class="pac-air-line" d="M-70 380 q20 -12 40 0 t40 0 t20 0" />
          <path class="pac-air-line" d="M-70 440 q20 -12 40 0 t40 0 t20 0" />
          <path class="pac-air-line" d="M-70 500 q20 -12 40 0 t40 0 t20 0" />
        </g>
        <text id="pac-air-label" x="-80" y="296" class="ph-label-soft">Air extérieur</text>
        <g id="pac-evap">
          <rect x="35" y="320" width="170" height="240" rx="38" fill="url(#pac-white)" filter="url(#pac-soft)" />
          <circle cx="120" cy="440" r="62" fill="url(#pac-mist)" />
          <g id="pac-fan" fill="#4a5878">
            <ellipse cx="120" cy="408" rx="15" ry="30" />
            <ellipse cx="120" cy="408" rx="15" ry="30" transform="rotate(120 120 440)" />
            <ellipse cx="120" cy="408" rx="15" ry="30" transform="rotate(240 120 440)" />
            <circle cx="120" cy="440" r="12" fill="#0b1633" />
          </g>
          <text x="120" y="606" text-anchor="middle" class="ph-label">Évaporateur</text>
        </g>

        <!-- 2. Compressor -->
        <g id="pac-comp">
          <rect x="300" y="160" width="110" height="140" rx="50" fill="url(#pac-night)" filter="url(#pac-soft)" />
          <rect x="318" y="176" width="20" height="70" rx="10" fill="#ffffff" opacity="0.18" />
          <text x="355" y="128" text-anchor="middle" class="ph-label">Compresseur</text>
        </g>

        <!-- 3. Condenser and the heating water -->
        <g id="pac-water">
          <path d="M600 380 H640" stroke="#e34234" stroke-width="14" stroke-linecap="round" />
          <path d="M600 500 H640" stroke="#93a6cc" stroke-width="14" stroke-linecap="round" />
          <g fill="url(#pac-white)" filter="url(#pac-soft)">
            <rect x="634" y="350" width="30" height="180" rx="15" />
            <rect x="668" y="350" width="30" height="180" rx="15" />
            <rect x="702" y="350" width="30" height="180" rx="15" />
            <rect x="736" y="350" width="30" height="180" rx="15" />
          </g>
          <g fill="none" stroke="#e34234" stroke-width="7" stroke-linecap="round">
            <path id="pac-h1" d="M660 320 q10 -14 0 -28 t0 -28" />
            <path id="pac-h2" d="M700 320 q10 -14 0 -28 t0 -28" />
            <path id="pac-h3" d="M740 320 q10 -14 0 -28 t0 -28" />
          </g>
          <text x="700" y="580" text-anchor="middle" class="ph-label">Chauffage</text>
        </g>
        <g id="pac-cond">
          <rect x="460" y="330" width="140" height="220" rx="36" fill="url(#pac-white)" filter="url(#pac-soft)" />
          <path d="M490 370 H570 Q585 370 585 385 Q585 400 570 400 H490 Q475 400 475 415 Q475 430 490 430 H570 Q585 430 585 445 Q585 460 570 460 H490 Q475 460 475 475 Q475 490 490 490 H570"
            fill="none" stroke="#e34234" stroke-width="10" stroke-linecap="round" />
          <text x="530" y="606" text-anchor="middle" class="ph-label">Condenseur</text>
        </g>

        <!-- 4. Expansion valve -->
        <g id="pac-valve">
          <path d="M280 622 L325 650 L280 678 Z M370 622 L325 650 L370 678 Z" fill="url(#pac-night)" stroke="url(#pac-night)" stroke-width="10" stroke-linejoin="round" filter="url(#pac-soft)" />
          <rect x="317" y="600" width="16" height="40" rx="8" fill="#0b1633" />
          <circle cx="325" cy="596" r="16" fill="url(#pac-night)" />
          <text x="325" y="726" text-anchor="middle" class="ph-label">Détendeur</text>
        </g>
      </svg>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const S = [0, 4.2, 8.4, 12.6]; // step starts (scene time), mirrored in each text block's data-start
    const L = 4.2;
    const END = 18;

    // ---- Shared step system (identical in every Phaness video) ----
    function stepText(t, title, sub, last) {
      tl.fromTo(title, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, t + 0.1);
      tl.fromTo(sub, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, t + 0.25);
      if (!last) tl.to([title, sub], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.04 }, t + L - 0.3);
    }
    function stepCounter(t, i, seg) {
      if (i > 0) tl.to("#pac-digits", { y: -128 * i, duration: 0.55, ease: "expo.inOut" }, t - 0.05);
      tl.fromTo(seg, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, t + 0.1);
    }
    tl.fromTo("#pac-disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.75)" }, 0.05);
    tl.fromTo("#pac-of", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 0.2);
    tl.fromTo("#pac-plinth", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "elastic.out(1, 0.85)" }, 0);
    ["#pac-p1", "#pac-p2", "#pac-p3", "#pac-p4"].forEach((seg, i) => stepCounter(S[i], i, seg));
    for (let i = 0; i < 4; i++) stepText(S[i], `#pac-t${i + 1}-title`, `#pac-t${i + 1}-sub`, i === 3);

    // ---- Constant motion: the fluid flows, the fan turns, the air blows (linear on purpose) ----
    tl.fromTo(["#pac-fa", "#pac-fb", "#pac-fc", "#pac-fd"], { strokeDashoffset: 0 }, { strokeDashoffset: -1440, duration: END, ease: "none" }, 0);
    tl.fromTo("#pac-fan", { rotation: 0, svgOrigin: "120 440" }, { rotation: 900, duration: END, ease: "none" }, 0);
    tl.fromTo(".pac-air-line", { strokeDashoffset: 0 }, { strokeDashoffset: -1200, duration: END, ease: "none" }, 0);

    // The pipe is drawn first: the empty circuit.
    tl.fromTo("#pac-pipe", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 0.1);

    // ---- One part per step; each enters with a soft spring, its fluid segment fades in ----
    function part(sel, t) {
      tl.fromTo(sel, { scale: 0.7, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.7)" }, t);
    }
    function flow(sel, t) {
      tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, t);
    }
    // 1. Evaporation
    tl.fromTo(["#pac-air", "#pac-air-label"], { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, S[0] + 0.5);
    part("#pac-evap", S[0] + 0.35);
    flow("#pac-fa", S[0] + 1.3);
    // 2. Compression
    part("#pac-comp", S[1] + 0.3);
    flow("#pac-fb", S[1] + 0.9);
    // 3. Condensation and the heating water
    part("#pac-cond", S[2] + 0.3);
    tl.fromTo("#pac-water", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" }, S[2] + 0.7);
    flow("#pac-fc", S[2] + 1.0);
    ["#pac-h1", "#pac-h2", "#pac-h3"].forEach((h, i) => {
      tl.fromTo(h, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, S[2] + 1.3 + i * 0.12);
    });
    // 4. Expansion: the loop closes and the whole cycle runs
    part("#pac-valve", S[3] + 0.3);
    flow("#pac-fd", S[3] + 0.9);

    window.__timelines["steps"] = tl;
  </script>
</template>
