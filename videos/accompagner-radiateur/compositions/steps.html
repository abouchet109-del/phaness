<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  </style>
  <div id="root" data-composition-id="steps" data-width="1920" data-height="1080">
    <div id="rad-counter" class="ph-counter">
      <div id="rad-disc" class="ph-disc" data-layout-allow-overflow>
        <div id="rad-digits" class="ph-digits"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
      </div>
      <span id="rad-of" class="ph-of">/ 6</span>
    </div>

    <div id="rad-t1" class="ph-step clip" data-start="0" data-duration="2.9" data-track-index="1">
      <h2 id="rad-t1-title" class="ph-step-title">Coupez le chauffage</h2>
      <p id="rad-t1-sub" class="ph-step-sub">Et laissez refroidir le radiateur.</p>
    </div>
    <div id="rad-t2" class="ph-step clip" data-start="2.9" data-duration="2.9" data-track-index="1">
      <h2 id="rad-t2-title" class="ph-step-title">Placez un récipient</h2>
      <p id="rad-t2-sub" class="ph-step-sub">Et un chiffon sous la <b>vis de purge</b>.</p>
    </div>
    <div id="rad-t3" class="ph-step clip" data-start="5.8" data-duration="2.7" data-track-index="1">
      <h2 id="rad-t3-title" class="ph-step-title">Ouvrez la vis</h2>
      <p id="rad-t3-sub" class="ph-step-sub">Avec une <b>clé de purge</b>.</p>
    </div>
    <div id="rad-t4" class="ph-step clip" data-start="8.5" data-duration="2.9" data-track-index="1">
      <h2 id="rad-t4-title" class="ph-step-title">Refermez</h2>
      <p id="rad-t4-sub" class="ph-step-sub">Dès que l’eau coule <b>sans bulles</b>.</p>
    </div>
    <div id="rad-t5" class="ph-step clip" data-start="11.4" data-duration="3.5" data-track-index="1">
      <h2 id="rad-t5-title" class="ph-step-title">Vérifiez la pression</h2>
      <p id="rad-t5-sub" class="ph-step-sub">De la chaudière : en général entre <b>1 et 1,5 bar</b>.</p>
    </div>
    <div id="rad-t6" class="ph-step clip" data-start="14.9" data-duration="3.5" data-track-index="1">
      <h2 id="rad-t6-title" class="ph-step-title">Rallumez</h2>
      <p id="rad-t6-sub" class="ph-step-sub">Remettez le chauffage en marche.</p>
    </div>

    <div class="ph-progress">
      <div class="ph-seg"><i id="rad-p1"></i></div>
      <div class="ph-seg"><i id="rad-p2"></i></div>
      <div class="ph-seg"><i id="rad-p3"></i></div>
      <div class="ph-seg"><i id="rad-p4"></i></div>
      <div class="ph-seg"><i id="rad-p5"></i></div>
      <div class="ph-seg"><i id="rad-p6"></i></div>
    </div>

    <div class="ph-stage" data-layout-allow-overflow>
      <svg viewBox="0 0 780 860">
        <defs>
          <radialGradient id="rad-cw" cx="36%" cy="22%" r="85%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.55" stop-color="#f5f7fb" />
            <stop offset="1" stop-color="#d3dbe9" />
          </radialGradient>
          <linearGradient id="rad-base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fdfeff" />
            <stop offset="1" stop-color="#d9e0ec" />
          </linearGradient>
          <radialGradient id="rad-night" cx="32%" cy="22%" r="90%">
            <stop offset="0" stop-color="#3a4c78" />
            <stop offset="0.55" stop-color="#16244a" />
            <stop offset="1" stop-color="#0b1633" />
          </radialGradient>
          <linearGradient id="rad-col" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.45" stop-color="#f4f7fb" />
            <stop offset="1" stop-color="#cfd8e7" />
          </linearGradient>
          <radialGradient id="rad-white" cx="34%" cy="24%" r="90%">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.6" stop-color="#f1f4fa" />
            <stop offset="1" stop-color="#cfd8e7" />
          </radialGradient>
          <filter id="rad-soft" x="-40%" y="-40%" width="180%" height="200%">
            <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0b1633" flood-opacity="0.15" />
          </filter>
          <filter id="rad-tight" x="-30%" y="-30%" width="160%" height="170%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1633" flood-opacity="0.2" />
          </filter>
          <filter id="rad-blur" x="-50%" y="-200%" width="200%" height="500%">
            <feGaussianBlur stdDeviation="14" />
          </filter>
          <!-- Soft left edge so the zoomed radiator never runs under the text column. -->
          <linearGradient id="rad-fadeg" gradientUnits="userSpaceOnUse" x1="-70" y1="0" x2="40" y2="0">
            <stop offset="0" stop-color="#000000" />
            <stop offset="1" stop-color="#ffffff" />
          </linearGradient>
          <mask id="rad-fade" maskUnits="userSpaceOnUse" x="-400" y="-300" width="1600" height="1500">
            <rect x="-400" y="-300" width="1600" height="1500" fill="url(#rad-fadeg)" />
          </mask>
          <clipPath id="rad-bowl-clip">
            <path d="M606 412 H714 Q714 472 660 472 Q606 472 606 412 Z" />
          </clipPath>
        </defs>

        <g mask="url(#rad-fade)">
        <g id="rad-cam">
        <g id="rad-plinth" filter="url(#rad-soft)">
          <circle cx="170" cy="730" r="95" fill="url(#rad-cw)" />
          <circle cx="340" cy="700" r="125" fill="url(#rad-cw)" />
          <circle cx="530" cy="715" r="110" fill="url(#rad-cw)" />
          <circle cx="660" cy="750" r="78" fill="url(#rad-cw)" />
          <rect x="70" y="735" width="660" height="105" rx="52" fill="url(#rad-base)" />
        </g>

        <g id="rad-scene">
          <ellipse cx="375" cy="762" rx="250" ry="18" fill="#0b1633" opacity="0.18" filter="url(#rad-blur)" />
          <!-- Radiator: six clay columns, feet, valve and purge screw. -->
          <g id="rad-body">
            <rect x="160" y="722" width="30" height="40" rx="10" fill="url(#rad-night)" />
            <rect x="560" y="722" width="30" height="40" rx="10" fill="url(#rad-night)" />
            <rect x="140" y="336" width="470" height="30" rx="15" fill="#dce3f0" />
            <rect x="140" y="680" width="470" height="30" rx="15" fill="#dce3f0" />
            <g filter="url(#rad-soft)">
              <rect x="140" y="310" width="70" height="420" rx="35" fill="url(#rad-col)" />
              <rect x="220" y="310" width="70" height="420" rx="35" fill="url(#rad-col)" />
              <rect x="300" y="310" width="70" height="420" rx="35" fill="url(#rad-col)" />
              <rect x="380" y="310" width="70" height="420" rx="35" fill="url(#rad-col)" />
              <rect x="460" y="310" width="70" height="420" rx="35" fill="url(#rad-col)" />
              <rect x="540" y="310" width="70" height="420" rx="35" fill="url(#rad-col)" />
            </g>
            <!-- Warm tint while the heating runs -->
            <g id="rad-warm" fill="#e34234" opacity="0.16">
              <rect x="140" y="310" width="70" height="420" rx="35" />
              <rect x="220" y="310" width="70" height="420" rx="35" />
              <rect x="300" y="310" width="70" height="420" rx="35" />
              <rect x="380" y="310" width="70" height="420" rx="35" />
              <rect x="460" y="310" width="70" height="420" rx="35" />
              <rect x="540" y="310" width="70" height="420" rx="35" />
            </g>
            <rect x="96" y="650" width="50" height="22" rx="11" fill="#dce3f0" />
            <g id="rad-knob">
              <rect x="62" y="590" width="50" height="104" rx="22" fill="url(#rad-night)" filter="url(#rad-tight)" />
              <rect x="82" y="600" width="10" height="34" rx="5" fill="#e34234" />
            </g>
            <g id="rad-screw">
              <rect x="608" y="322" width="32" height="28" rx="7" fill="url(#rad-night)" />
              <rect x="634" y="329" width="12" height="14" rx="4" fill="#4a5878" />
            </g>
          </g>
          <g id="rad-heat" fill="none" stroke="#e34234" stroke-width="9" stroke-linecap="round">
            <path d="M215 280 q14 -18 0 -36 t0 -36" />
            <path d="M335 280 q14 -18 0 -36 t0 -36" />
            <path d="M455 280 q14 -18 0 -36 t0 -36" />
            <path d="M575 280 q14 -18 0 -36 t0 -36" />
          </g>

          <!-- Tools used during the bleed (they leave with the radiator at step 5 and don't come back). -->
          <g id="rad-tools">
            <g id="rad-bowl">
              <path d="M600 406 H720 Q720 478 660 478 Q600 478 600 406 Z" fill="url(#rad-white)" filter="url(#rad-soft)" />
              <rect x="596" y="400" width="128" height="14" rx="7" fill="#eef2f8" />
              <g clip-path="url(#rad-bowl-clip)">
                <rect id="rad-level" x="600" y="430" width="120" height="50" fill="#93a6cc" />
              </g>
            </g>
            <path id="rad-cloth" d="M612 352 Q630 360 652 352 Q676 344 690 356 L686 386 Q668 378 650 388 Q628 396 614 384 Z" fill="#93a6cc" filter="url(#rad-tight)" />
            <g id="rad-drops" fill="#6f86b8">
              <path id="rad-d1" d="M652 352 q8 12 0 18 q-8 -6 0 -18 Z" />
              <path id="rad-d2" d="M652 352 q8 12 0 18 q-8 -6 0 -18 Z" />
              <path id="rad-d3" d="M652 352 q8 12 0 18 q-8 -6 0 -18 Z" />
              <path id="rad-d4" d="M652 352 q8 12 0 18 q-8 -6 0 -18 Z" />
            </g>
            <g id="rad-key">
              <rect x="644" y="330" width="58" height="12" rx="6" fill="#4a5878" />
              <rect id="rad-key-handle" x="700" y="296" width="18" height="80" rx="9" fill="url(#rad-night)" filter="url(#rad-tight)" />
            </g>
            <g id="rad-air" fill="none" stroke="#93a6cc" stroke-width="6" stroke-linecap="round">
              <path id="rad-a1" d="M652 318 q10 -16 26 -18" />
              <path id="rad-a2" d="M662 312 q16 -22 40 -22" />
              <path id="rad-a3" d="M644 312 q2 -22 14 -34" />
            </g>
            <g id="rad-ccw" fill="none" stroke="#e34234" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M752 300 A52 52 0 0 0 668 290" />
              <path d="M668 290 L670 312 M668 290 L690 286" />
            </g>
            <g id="rad-cw-arrow" fill="none" stroke="#e34234" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M668 290 A52 52 0 0 1 752 300" />
              <path d="M752 300 L748 278 M752 300 L730 302" />
            </g>
          </g>
        </g>

        </g>
        </g>

        <!-- Step 5: the boiler's pressure gauge, 0 to 4 bar, normal zone 1 to 1.5 bar. -->
        <g id="rad-gauge">
          <ellipse cx="390" cy="740" rx="170" ry="18" fill="#0b1633" opacity="0.18" filter="url(#rad-blur)" />
          <circle cx="390" cy="430" r="250" fill="url(#rad-white)" filter="url(#rad-soft)" />
          <circle cx="390" cy="430" r="214" fill="#f8fafd" stroke="#dce3f0" stroke-width="4" />
          <path d="M269.8 550.2 A170 170 0 1 1 510.2 550.2" fill="none" stroke="#dce3f0" stroke-width="26" stroke-linecap="round" />
          <path id="rad-zone" d="M232.9 364.9 A170 170 0 0 1 295.5 288.7" fill="none" stroke="#e34234" stroke-width="26" stroke-linecap="round" />
          <g font-family="Geist" font-size="34" font-weight="600" fill="#0b1633" text-anchor="middle">
            <text x="305" y="527">0</text>
            <text x="279" y="396">1</text>
            <text x="390" y="322">2</text>
            <text x="501" y="396">3</text>
            <text x="475" y="527">4</text>
          </g>
          <text x="390" y="596" text-anchor="middle" class="ph-label-soft">bar</text>
          <g id="rad-needle">
            <path d="M382 430 L390 282 L398 430 Z" fill="url(#rad-night)" />
          </g>
          <circle cx="390" cy="430" r="24" fill="url(#rad-night)" filter="url(#rad-tight)" />
        </g>
      </svg>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const S = [0, 2.9, 5.8, 8.5, 11.4, 14.9]; // step starts (scene time), mirrored in each text block's data-start
    const E = [2.9, 5.8, 8.5, 11.4, 14.9, null]; // step ends (null: last step, no exit)

    // ---- Shared step system (identical in every Phaness video) ----
    function stepText(t, end, title, sub) {
      tl.fromTo(title, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, t + 0.1);
      tl.fromTo(sub, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power4.out" }, t + 0.25);
      if (end !== null) tl.to([title, sub], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.04 }, end - 0.3);
    }
    function stepCounter(t, i, seg) {
      if (i > 0) tl.to("#rad-digits", { y: -128 * i, duration: 0.55, ease: "expo.inOut" }, t - 0.05);
      tl.fromTo(seg, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, t + 0.1);
    }
    tl.fromTo("#rad-disc", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "elastic.out(1, 0.75)" }, 0.05);
    tl.fromTo("#rad-of", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 0.2);
    tl.fromTo("#rad-plinth", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "elastic.out(1, 0.85)" }, 0);
    ["#rad-p1", "#rad-p2", "#rad-p3", "#rad-p4", "#rad-p5", "#rad-p6"].forEach((seg, i) => stepCounter(S[i], i, seg));
    for (let i = 0; i < 6; i++) stepText(S[i], E[i], `#rad-t${i + 1}-title`, `#rad-t${i + 1}-sub`);

    // Initial state of the tools and the gauge (hidden until their step).
    tl.fromTo("#rad-scene", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "elastic.out(1, 0.85)" }, 0.05);
    tl.fromTo("#rad-gauge", { x: 300, scale: 0.8, opacity: 0, svgOrigin: "390 430" }, { x: 0, scale: 1, opacity: 1, duration: 0.9, ease: "elastic.out(1, 0.8)" }, S[4] + 0.1);

    // ---- 1. Heating off: the knob turns to zero, the heat fades, the radiator cools ----
    tl.fromTo("#rad-knob", { rotation: 0, svgOrigin: "87 642" }, { rotation: -100, duration: 0.7, ease: "power3.inOut" }, S[0] + 0.6);
    tl.to("#rad-heat", { opacity: 0, y: -20, duration: 0.7, ease: "power2.in" }, S[0] + 1.1);
    tl.to("#rad-warm", { opacity: 0, duration: 1.2, ease: "power1.inOut" }, S[0] + 1.2);

    // ---- Camera: push in on the purge screw for steps 2 to 4, back out for step 5 ----
    tl.fromTo("#rad-cam", { scale: 1, svgOrigin: "690 380" }, { scale: 1.55, duration: 1.0, ease: "power2.inOut" }, S[1] - 0.15);
    tl.to("#rad-cam", { scale: 1, duration: 0.6, ease: "power2.inOut" }, S[4] - 0.35);

    // ---- 2. Bowl and cloth under the purge screw ----
    tl.fromTo("#rad-bowl", { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, S[1] + 0.3);
    tl.fromTo("#rad-cloth", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "elastic.out(1, 0.7)" }, S[1] + 0.7);
    tl.fromTo("#rad-level", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 0, duration: 0.01 }, S[1]);

    // ---- 3. The key opens the screw: air escapes ----
    tl.fromTo("#rad-key", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, S[2] + 0.2);
    tl.fromTo("#rad-ccw", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, S[2] + 0.7);
    tl.fromTo("#rad-key-handle", { rotation: 0, svgOrigin: "709 336" }, { rotation: -40, duration: 0.6, ease: "power3.inOut" }, S[2] + 0.8);
    tl.to("#rad-ccw", { opacity: 0, duration: 0.25, ease: "power2.in" }, S[2] + 2.0);
    ["#rad-a1", "#rad-a2", "#rad-a3"].forEach((a, i) => {
      tl.fromTo(a, { opacity: 0, x: -8, y: 8 }, { opacity: 1, x: 0, y: 0, duration: 0.3, ease: "power2.out" }, S[2] + 1.2 + i * 0.15);
      tl.to(a, { opacity: 0, x: 8, y: -8, duration: 0.3, ease: "power2.in" }, S[2] + 1.9 + i * 0.15);
    });

    // ---- 4. Water runs without bubbles, then the key closes ----
    ["#rad-d1", "#rad-d2", "#rad-d3", "#rad-d4"].forEach((d, i) => {
      tl.fromTo(d, { y: 0, opacity: 0 }, { y: 82, opacity: 1, duration: 0.35, ease: "power2.in" }, S[3] + 0.2 + i * 0.3);
      tl.to(d, { opacity: 0, duration: 0.05, ease: "none" }, S[3] + 0.55 + i * 0.3);
    });
    tl.to("#rad-level", { scaleY: 0.7, duration: 1.2, ease: "power1.inOut" }, S[3] + 0.5);
    tl.fromTo("#rad-cw-arrow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, S[3] + 1.5);
    tl.to("#rad-key-handle", { rotation: 0, duration: 0.6, ease: "power3.inOut" }, S[3] + 1.6);
    tl.to("#rad-cw-arrow", { opacity: 0, duration: 0.25, ease: "power2.in" }, S[3] + 2.5);

    // ---- 5. The radiator slides away, the boiler gauge comes in; the needle settles at 1.2 bar ----
    tl.to("#rad-scene", { x: -320, opacity: 0, duration: 0.5, ease: "power3.in" }, S[4] - 0.35);
    tl.to("#rad-tools", { opacity: 0, duration: 0.01, ease: "none" }, S[4] + 0.3);
    tl.fromTo("#rad-needle", { rotation: -135, svgOrigin: "390 430" }, { rotation: -54, duration: 1.4, ease: "elastic.out(1, 0.6)" }, S[4] + 0.6);
    tl.fromTo("#rad-zone", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, S[4] + 1.6);

    // ---- 6. Back to the radiator: heating on, warmth returns ----
    tl.to("#rad-gauge", { x: 320, opacity: 0, duration: 0.45, ease: "power3.in" }, S[5] - 0.45);
    tl.to("#rad-scene", { x: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, S[5] - 0.1);
    tl.to("#rad-knob", { rotation: 0, duration: 0.7, ease: "power3.inOut" }, S[5] + 0.5);
    tl.to("#rad-warm", { opacity: 0.16, duration: 1.0, ease: "power1.inOut" }, S[5] + 0.9);
    tl.to("#rad-heat", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, S[5] + 1.1);

    window.__timelines["steps"] = tl;
  </script>
</template>
