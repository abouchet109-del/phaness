  <script>
    const tl = gsap.timeline({ paused: true });
    const E = PH.EASE;

    // Layout: six sheets, 1920x1080, in two rows, read as an S.
    const P = [[240, 240], [2400, 240], [4560, 240], [4560, 1680], [2400, 1680], [240, 1680]];
    const v = (i, x, y) => `${P[i][0] + x} ${P[i][1] + y}`;
    const rest = (i, o = {}) => ({ x: P[i][0] + 960, y: P[i][1] + 540, z: 0.93, rx: 0, ry: 0, rz: 0, ...o });
    const cam = PH.camera(tl, { x: 1235, y: 780, z: 1 });

    // The knot. q=0 tangled, q=1 straight line along sheet 0. The two ends pull first, the core lets go last.
    const knot = document.querySelector("#knot");
    const knotD = (q) => {
      const N = 900;
      let d = "";
      for (let i = 0; i <= N; i++) {
        const s = i / N, a = 2 * Math.PI * s;
        const x0 = 1560 + 300 * Math.sin(a * 3 + 0.6) + 150 * Math.sin(a * 13 + 1.2) + 70 * Math.sin(a * 29);
        const y0 = 780 + 235 * Math.cos(a * 4 + 0.2) + 135 * Math.cos(a * 11 + 2.1) + 60 * Math.sin(a * 31 + 0.5);
        const x1 = 360 + 1800 * s, y1 = 780;
        const delay = 0.55 * (1 - Math.abs(2 * s - 1));
        let k = Math.min(1, Math.max(0, (q - delay) / 0.45));
        k = k * k * (3 - 2 * k);
        d += (i ? "L" : "M") + (x0 + (x1 - x0) * k).toFixed(1) + " " + (y0 + (y1 - y0) * k).toFixed(1);
      }
      return d;
    };
    knot.setAttribute("d", knotD(0));
    knot.setAttribute("pathLength", "1");
    gsap.set("#knot", { attr: { "stroke-dasharray": "1 1.01", "stroke-dashoffset": 0.62 } });
    gsap.set("#knot-svg", { z: 36 });
    tl.to("#knot", { attr: { "stroke-dashoffset": 0 }, duration: 2.5, ease: "power1.inOut" }, 0);
    const kq = { q: 0 };
    tl.to(kq, { q: 1, duration: 1.5, ease: "power2.inOut", onUpdate: () => knot.setAttribute("d", knotD(kq.q)) }, 2.95);
    tl.to("#knot", { stroke: "#247855", duration: 0.7, ease: "none" }, 3.3);
    tl.to("#knot-svg", { z: 2, duration: 0.5, ease: E.move }, 4.1);

    // The main thread, from the end of the straightened knot to the empty frame.
    const th = PH.thread(tl, {
      paths: ["#thread", "#thread-w"],
      head: "#head",
      segs: [
        ["s0", `M ${v(0, 1920, 540)} L ${v(1, 240, 540)} Q ${v(1, 300, 540)} ${v(1, 300, 600)} L ${v(1, 300, 820)} Q ${v(1, 300, 880)} ${v(1, 360, 880)}`],
        ["s1", `L ${v(1, 750, 880)}`],
        ["s2", `Q ${v(1, 780, 880)} ${v(1, 780, 850)} L ${v(1, 780, 710)} Q ${v(1, 780, 680)} ${v(1, 810, 680)} L ${v(1, 1150, 680)}`],
        ["s3", `Q ${v(1, 1180, 680)} ${v(1, 1180, 650)} L ${v(1, 1180, 510)} Q ${v(1, 1180, 480)} ${v(1, 1210, 480)} L ${v(1, 1550, 480)}`],
        ["s4", `Q ${v(1, 1580, 480)} ${v(1, 1580, 450)} L ${v(1, 1580, 200)} Q ${v(1, 1580, 140)} ${v(1, 1640, 140)} L ${v(2, 640, 140)} C ${v(2, 800, 140)} ${v(2, 900, 360)} ${v(2, 900, 560)}`],
        ["ring", `A 380 380 0 0 0 ${v(2, 1280, 940)} A 380 380 0 0 0 ${v(2, 1660, 560)} A 380 380 0 0 0 ${v(2, 1280, 180)} A 380 380 0 0 0 ${v(2, 900, 560)} A 380 380 0 0 0 ${v(2, 1280, 940)}`],
        ["down", `C ${v(2, 1500, 940)} ${v(2, 1860, 960)} ${v(2, 1860, 1120)} L ${v(3, 1860, 950)} Q ${v(3, 1860, 1010)} ${v(3, 1800, 1010)} L ${v(3, 700, 1010)}`],
        ["port", `L ${v(4, 720, 1010)} Q ${v(4, 560, 1010)} ${v(4, 560, 930)}`],
        ["under", `L ${v(4, 560, 600)} Q ${v(4, 560, 560)} ${v(4, 520, 560)} L ${v(4, 340, 560)}`],
        ["toFrame", `L ${v(5, 1520, 560)}`],
        ["frame", `L ${v(5, 1520, 257)} Q ${v(5, 1520, 225)} ${v(5, 1488, 225)} L ${v(5, 432, 225)} Q ${v(5, 400, 225)} ${v(5, 400, 257)} L ${v(5, 400, 823)} Q ${v(5, 400, 855)} ${v(5, 432, 855)} L ${v(5, 1488, 855)} Q ${v(5, 1520, 855)} ${v(5, 1520, 823)} L ${v(5, 1520, 560)}`],
      ],
    });
